        <span><select class="inp mini ${r.guessed?'guess':''}" data-pr="${i}" data-k="pos" aria-label="Position">${sp.positions.map(([v,l])=>`<option value="${v}" ${r.pos===v?'selected':''}>${l}</option>`).join('')}</select></span><span class="c"><input type="checkbox" data-pr="${i}" data-k="sub" ${r.sub?'checked':''} aria-label="Sub"></span></div>`).join('')}</div>`}
    <div class="err" id="err"></div>
    <div class="actions" style="justify-content:space-between">${rows?'<button class="btn" data-act="pasteback">Back</button>':'<span></span>'}
      <span class="cardact"><button class="btn" data-act="${PASTE.step?'pasteskip':'close'}">${PASTE.step?'Skip for now':'Cancel'}</button>${rows?`<button class="btn primary" data-act="pasteadd">Add ${rows.length} player${rows.length===1?'':'s'}</button>`:'<button class="btn primary" data-act="pasteparse">Next</button>'}</span></div></div></div>`;
}
function readPasteRows(){ document.querySelectorAll('[data-pr]').forEach(el=>{ const r=PASTE.rows[+el.dataset.pr], k=el.dataset.k; r[k]=el.type==='checkbox'?el.checked:k==='num'?(el.value===''?null:+el.value):el.value.trim(); }); }

/* ---------- live scoring ---------- */
const LIVE={
  hockey:{us:[{l:'Goal',pts:1,stat:'g',assists:2},{l:'Penalty (2 min)',pts:0,stat:'pim',v:2}],them:[{l:'Goal',pts:1}]},
  soccer:{us:[{l:'Goal',pts:1,stat:'g',assists:1},{l:'Yellow card',pts:0,stat:'yc'}],them:[{l:'Goal',pts:1}]},
  rugby:{us:[{l:'Try +5',pts:5,stat:'tr',try:1},{l:'Conversion +2',pts:2,stat:'con'},{l:'Penalty goal +3',pts:3,stat:'pen'},{l:'Yellow card',pts:0,stat:'yc'}],them:[{l:'Try +5',pts:5,try:1},{l:'Conversion +2',pts:2},{l:'Penalty +3',pts:3}]},
  basketball:{us:[{l:'+1',pts:1,stat:'pts',v:1},{l:'+2',pts:2,stat:'pts',v:2},{l:'+3',pts:3,stat:'pts',v:3},{l:'Rebound',pts:0,stat:'reb'},{l:'Assist',pts:0,stat:'ast'}],them:[{l:'+1',pts:1},{l:'+2',pts:2},{l:'+3',pts:3}]},
  football:{us:[{l:'Touchdown +6',pts:6,stat:'td'},{l:'Extra point +1',pts:1},{l:'Extra point +2',pts:2},{l:'Interception',pts:0,stat:'int'},{l:'Flag pull',pts:0,stat:'flg'}],them:[{l:'Touchdown +6',pts:6},{l:'+1',pts:1},{l:'+2',pts:2}]},
  baseball:{us:[{l:'Run scores',pts:1,stat:'r',rbi:1},{l:'Hit',pts:0,stat:'h'},{l:'Home run',pts:1,stat:'hr',hr:1}],them:[{l:'Run',pts:1}]},
};
function liveScore(t){ const L=t.live, cfg=LIVE[t.sport]; let us=0,them=0,ut=0,tt=0;
  L.ev.forEach(e=>{ const b=(e.side==='us'?cfg.us:cfg.them)[e.b]; if(e.side==='us'){ us+=b.pts; if(b.try) ut++; } else { them+=b.pts; if(b.try) tt++; } }); return {us,them,ut,tt}; }
let LP=null;
function renderLive(){
  const t=team(), L=t.live, g=findGame(t,L.gid), cfg=LIVE[t.sport], sc=liveScore(t), sp=SPORTS[t.sport];
  if(LP){ const b=cfg.us[LP.b], a=availFor(t,g), pool=sortPlayers(t,t.players.filter(p=>a[p.id]==='in')), others=sortPlayers(t,t.players.filter(p=>a[p.id]!=='in'));
    const stage=LP.stage, title=stage==='who'?`${b.l}: who?`:stage==='rbi'?'RBI: who was batting?':`Assist ${LP.a.length+1}?`;
    const pick=p=>`<button data-act="lvpick" data-v="${p.id}" ${LP.pid===p.id||LP.a.includes(p.id)?'disabled':''}>${p.num!=null?`<i>#${p.num}</i> `:''}${esc(fullName(p))}<span>${esc(posName(t,p.pos))}</span></button>`;
    modalRoot().innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-modal="true" style="max-width:520px"><h2>${esc(title)}</h2>
      <div class="who">${pool.map(pick).join('')}</div>${others.length?`<details style="margin-top:10px"><summary class="meta">Someone not marked In</summary><div class="who" style="margin-top:8px">${others.map(pick).join('')}</div></details>`:''}
      <div class="actions" style="justify-content:space-between"><button class="btn" data-act="lvcancel">Back</button>${stage!=='who'?`<button class="btn primary" data-act="lvnone">${stage==='rbi'?'No RBI':LP.a.length?'No more assists':'Unassisted'}</button>`:''}</div></div></div>`;
    return;
  }
  const evTxt=e=>{ const b=(e.side==='us'?cfg.us:cfg.them)[e.b], p=e.pid&&pById(t,e.pid);
    return `${e.side==='us'?`<b>${esc(t.name)}</b>`:esc(oppOf(t,g))} · ${esc(b.l)}${p?` · ${esc(shortName(p))}`:''}${e.a&&e.a.length?` (${e.a.map(id=>esc(shortName(pById(t,id)))).join(', ')})`:''}${e.rbi?` · RBI ${esc(shortName(pById(t,e.rbi)))}`:''}`; };
  modalRoot().innerHTML=`<div class="overlay"><div class="modal live" role="dialog" aria-modal="true" style="max-width:560px">
    <div class="lvhead"><span class="lvdot" aria-hidden="true"></span> Live · ${fmtDate(g.date)}</div>
    <div class="board"><div><span class="tn">${esc(t.name)}</span><b>${sc.us}</b>${sp.tries?`<span class="meta sm">${sc.ut} tries</span>`:''}</div><span class="dash">–</span><div><span class="tn">${esc(oppOf(t,g))}</span><b>${sc.them}</b>${sp.tries?`<span class="meta sm">${sc.tt} tries</span>`:''}</div></div>
    <h3 class="mh">Us</h3><div class="lvbtns">${cfg.us.map((b,i)=>`<button class="btn ${b.pts?'primary':''}" data-act="lvus" data-v="${i}">${esc(b.l)}</button>`).join('')}</div>
    <h3 class="mh">Them</h3><div class="lvbtns">${cfg.them.map((b,i)=>`<button class="btn" data-act="lvthem" data-v="${i}">${esc(b.l)}</button>`).join('')}</div>
    <h3 class="mh">Play by play</h3><div class="lvlog">${L.ev.length?[...L.ev].reverse().map(e=>`<div class="lvev"><span>${evTxt(e)}</span><button class="link x" data-act="lvdel" data-v="${e.id}" aria-label="Remove this event">✕</button></div>`).join(''):'<p class="meta">Tap a button above when something happens.</p>'}</div>
    <div class="err" id="err"></div>
    <div class="actions" style="justify-content:space-between"><button class="btn" data-act="lvhide">Minimize</button><span class="cardact"><button class="btn danger" data-act="lvquit">Discard</button><button class="btn primary" data-act="lvfinish">Finish game</button></span></div></div></div>`;
}
function finishLive(t,otWinner){
  const L=t.live, g=findGame(t,L.gid), cfg=LIVE[t.sport], sc=liveScore(t), sp=SPORTS[t.sport], kp=sp.stats.keeper, home=g.home===t.name;
  let us=sc.us, them=sc.them, ot=false;
  if(!sp.ties&&us===them){ if(!otWinner) return 'tie'; ot=sp.ot; otWinner==='us'?us++:them++; }
  Object.assign(g, home?{hs:us,as:them}:{hs:them,as:us}, {final:true}); if(sp.tries) Object.assign(g, home?{ht:sc.ut,at:sc.tt}:{ht:sc.tt,at:sc.ut}); if(sp.ot) g.ot=ot;
  const a=availFor(t,g), line={}, zero=()=>Object.fromEntries(sp.stats.fields.map(f=>[f[0],0]));
  const played=new Set([...t.players.filter(p=>a[p.id]==='in').map(p=>p.id), ...L.ev.flatMap(e=>[e.pid,...(e.a||[]),e.rbi]).filter(Boolean)]);
  played.forEach(id=>{ const p=pById(t,id); if(!p) return; if(kp&&!kp.both&&p.pos===kp.pos) return; line[id]=zero(); });
  L.ev.filter(e=>e.side==='us').forEach(e=>{ const b=cfg.us[e.b]; const o=e.pid&&line[e.pid]; if(o&&b.stat) o[b.stat]+=b.v||1;
    if(b.hr&&o){ o.h++; o.r++; o.rbi++; } (e.a||[]).forEach(id=>{ if(line[id]) line[id][t.sport==='hockey'||t.sport==='soccer'?'a':'ast']++; }); if(e.rbi&&line[e.rbi]) line[e.rbi].rbi++; });
  if(t.sport==='baseball') Object.values(line).forEach(o=>{ o.ab=Math.max(o.ab,o.h,3); });
  if(kp){ const ks=t.players.filter(p=>p.pos===kp.pos&&a[p.id]==='in'), k=ks.find(p=>!p.sub)||ks[0];
    if(k){ const key=kp.both?'k:'+k.id:k.id; line[key]=kp.both?{ip:7,k:0,bb:0,er:them}:{sv:0,ga:them}; } }
  (t.stats ||= {})[g.id]=line; t.live=null; return 'ok';
}

/* ---------- actions ---------- */
function extraAct2(act,v,el,t,e){
  const g=nextGame(t), me=pById(t,S.me[t.id]);
  switch(act){
    case 'undo': if(UNDO){ S=JSON.parse(UNDO); UNDO=null; const el2=document.getElementById('toast'); el2.classList.remove('show','hasbtn'); closeModal(); toast('Undone'); return true; } return false;
    case 'div': UI[el.dataset.k]=v; return true;
    case 'kitswap': t.kit[g.id]=kitFor(t,g)==='home'?'away':'home'; return true;
    case 'gstatus': openStatus(t,v); return false;
    case 'gstsave': { const gg=findGame(t,v), mode=document.querySelector('input[name=gst]:checked').value, reason=document.getElementById('gReason').value, nd=document.getElementById('gNew').value;
      snap(); const orig=gg.moved||gg.date; delete gg.cancelled; delete gg.tbd; delete gg.moved; gg.cancelReason=reason;
      if(mode==='cancel'){ gg.cancelled=true; gg.date=orig; }
      else if(nd){ if(nd===orig){ document.getElementById('err').textContent='Pick a different date, or leave it blank for TBD.'; return false; } gg.moved=orig; gg.date=nd; }
      else { gg.tbd=true; gg.moved=orig; }
      closeModal(); toastUndo(mode==='cancel'?'Game cancelled. Both teams notified (prototype)':'Game postponed. Both teams notified (prototype)'); return true; }
    case 'gstclear': { const gg=findGame(t,v); if(gg.moved) gg.date=gg.moved; ['cancelled','tbd','moved','cancelReason'].forEach(k=>delete gg[k]); closeModal(); toast('Game is back on'); return true; }
    case 'rideoffer': openRideOffer(t); return false;
    case 'ridesave': { const from=document.getElementById('rFrom').value.trim(); if(!from){ document.getElementById('err').textContent='Where are you leaving from?'; return false; }
      const R=t.rides[g.id]; R.needs=R.needs.filter(id=>id!==me.id); R.offers.push({id:uid(),pid:me.id,seats:+document.getElementById('rSeats').value,from,riders:[]}); closeModal(); toast('Ride offered 🚗'); return true; }
    case 'ridejoin': { const R=t.rides[g.id], o=R.offers.find(x=>x.id===v); o.riders.push(me.id); R.needs=R.needs.filter(id=>id!==me.id); toast(`You’re riding with ${pById(t,o.pid).first}`); return true; }
    case 'rideleave': { const o=t.rides[g.id].offers.find(x=>x.id===v); o.riders=o.riders.filter(id=>id!==me.id); return true; }
    case 'ridedel': snap(); t.rides[g.id].offers=t.rides[g.id].offers.filter(x=>x.id!==v); toastUndo('Ride removed'); return true;
    case 'rideneed': { const R=t.rides[g.id]; R.needs=R.needs.includes(me.id)?R.needs.filter(id=>id!==me.id):[...R.needs,me.id]; return true; }
    case 'away': openAway(t,me); return false;
    case 'awaysave': { let n=0; document.querySelectorAll('[data-away]').forEach(cb=>{ const gg=findGame(t,cb.dataset.away), a=availFor(t,gg); if(cb.checked){ if(a[me.id]!=='out') n++; a[me.id]='out'; } else if(a[me.id]==='out') delete a[me.id]; });
      closeModal(); toast(n?`Marked out for ${n} game${n>1?'s':''}. Enjoy the trip ✈️`:'Saved'); return true; }
    case 'pedit': openPlayer(t,v); return false;
    case 'psave': { const p=pById(t,v), q=id=>document.getElementById(id), num=q('pNum').value===''?null:+q('pNum').value, em=q('pEmail').value.trim(), err=q('err');
      if(!q('pFirst').value.trim()||!q('pLast').value.trim()) return err.textContent='First and last name are both needed.', false;
      if(num!=null&&(num<0||num>99)) return err.textContent='Numbers go from 0 to 99.', false;
      const clash=num!=null&&t.players.find(x=>x.id!==p.id&&x.num===num); if(clash) return err.textContent=`#${num} is already ${fullName(clash)}’s number.`, false;
      if(em&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return err.textContent='That email doesn’t look right.', false;
      Object.assign(p,{first:q('pFirst').value.trim(), last:q('pLast').value.trim(), num, pos:q('pPos').value, sub:q('pSub').checked, hide:q('pHide').checked}); if(em) p.email=em; else delete p.email;
      if(q('pHand')) p.hand=q('pHand').value||undefined;
      if(q('pSusp')){ if(q('pSusp').checked) t.manSusp[p.id]=g.id; else if(t.manSusp[p.id]===g.id) delete t.manSusp[p.id]; }
      closeModal(); toast('Player saved'); return true; }
    case 'subup': case 'subdown': { const i=+v, j=act==='subup'?i-1:i+1; [t.subOrder[i],t.subOrder[j]]=[t.subOrder[j],t.subOrder[i]]; return true; }
    case 'spirit': t.spirit[el.dataset.g]={score:+v,note:''}; closeModal(); toast(`Rated ${v}/5. Thanks for keeping it friendly 🤝`); return true;
    case 'spiritopen': { const gg=findGame(t,v);
      modalRoot().innerHTML=`<div class="overlay" data-act="close"><div class="modal" role="dialog" aria-modal="true" style="max-width:460px"><h2>🤝 ${esc(oppOf(t,gg))}’s spirit</h2>
        <p class="meta" style="margin-top:-6px">${fmtDate(gg.date)}. How were they to play against?</p>
        <div class="stars">${[1,2,3,4,5].map(n=>`<button data-act="spirit" data-g="${gg.id}" data-v="${n}" aria-label="${n} out of 5, ${SPIRIT_WORDS[n]}"><b>${n}</b><span>${SPIRIT_WORDS[n]}</span></button>`).join('')}</div>
        <div class="actions" style="justify-content:flex-end"><button class="btn" data-act="close">Cancel</button></div></div></div>`; return false; }
    case 'paste': openPaste(t,0); return false;
    case 'pasteparse': { PASTE.text=document.getElementById('pasteIn').value; const rows=parseRoster(t,PASTE.text); if(!rows.length){ document.getElementById('err').textContent='No names found. Put one player on each line.'; return false; } PASTE.rows=rows; renderPaste(); return false; }
    case 'pasteback': PASTE.rows=null; renderPaste(); return false;
    case 'pasteadd': { readPasteRows(); const rows=PASTE.rows.filter(r=>r.first); const used=new Set(t.players.map(p=>p.num).filter(n=>n!=null));
      rows.forEach(r=>{ const num=r.num!=null&&!used.has(r.num)?r.num:null; if(num!=null) used.add(num); t.players.push({id:uid(),first:r.first,last:r.last||'?',pos:r.pos,sub:!!r.sub,num}); });
      const step=PASTE.step; PASTE=null; closeModal(); save(); render(); toast(`${rows.length} player${rows.length===1?'':'s'} added`); if(step) openInvite(true); return false; }
    case 'pasteskip': PASTE=null; closeModal(); render(); openInvite(true); return false;
    case 'live': { if(!t.live||t.live.gid!==g.id) t.live={gid:g.id, ev:[]}; save(); LP=null; renderLive(); return false; }
    case 'lvus': { const b=LIVE[t.sport].us[+v]; LP={b:+v, stage:'who', pid:null, a:[]}; renderLive(); return false; }
    case 'lvthem': t.live.ev.push({id:uid(), side:'them', b:+v}); save(); renderLive(); return false;
    case 'lvpick': { const b=LIVE[t.sport].us[LP.b];
      if(LP.stage==='who'){ LP.pid=v; if(b.assists){ LP.stage='assist'; renderLive(); return false; } if(b.rbi){ LP.stage='rbi'; renderLive(); return false; } }
      else if(LP.stage==='assist'){ LP.a.push(v); if(LP.a.length<b.assists){ renderLive(); return false; } }
      else if(LP.stage==='rbi'){ LP.rbi=v; }
      t.live.ev.push({id:uid(), side:'us', b:LP.b, pid:LP.pid, a:LP.a, rbi:LP.rbi}); LP=null; save(); renderLive(); return false; }
    case 'lvnone': t.live.ev.push({id:uid(), side:'us', b:LP.b, pid:LP.pid, a:LP.a}); LP=null; save(); renderLive(); return false;
    case 'lvcancel': LP=null; renderLive(); return false;
    case 'lvdel': t.live.ev=t.live.ev.filter(x=>x.id!==v); save(); renderLive(); return false;
    case 'lvhide': closeModal(); render(); return false;
    case 'lvquit': { if(el.dataset.ok!=='1'){ el.dataset.ok='1'; el.textContent='Tap again to discard'; return false; } t.live=null; closeModal(); toast('Live game discarded'); return true; }
    case 'lvfinish': { const sp=SPORTS[t.sport], sc=liveScore(t);
      if(!sp.ties&&sc.us===sc.them&&!el.dataset.ot){ document.getElementById('err').innerHTML=`It’s tied. Who won ${sp.ot?'in overtime or the shootout':'in extra time'}? <span class="cardact" style="margin-top:8px"><button class="btn small" data-act="lvfinish" data-ot="us">We did</button><button class="btn small" data-act="lvfinish" data-ot="them">They did</button></span>`; return false; }
      snap(); finishLive(t, el.dataset.ot); closeModal(); toastUndo('Final saved. Stats filled in from live scoring'); return true; }
  }
  return null;
}
document.addEventListener('submit', e=>{
  if(e.target.id!=='suspForm') return; e.preventDefault(); const t=team(); t.suspRule.every=Math.max(1,+document.getElementById('suspEvery').value||1); toast('Discipline rule updated'); save(); render();

function setUser(session){ const u=session&&session.user; CLOUD.uid=u?u.id:null; CLOUD.email=u?u.email||null:null; CLOUD.anon=!!(u&&(u.is_anonymous||!u.email)); }
async function loadMyTeams(){
  if(!CLOUD.uid) return; CLOUD.loading=true;
  try{ const {data,error}=await CLOUD.sb.from('team_members').select('team_id').eq('user_id',CLOUD.uid); if(error) throw error;
    let last=null; try{ last=localStorage.getItem('hc-cloud-current'); }catch(e){}
    for(const m of data) await addCloudTeam(m.team_id, false);
    const ids=data.map(m=>m.team_id); if(ids.length&&(!S.teams[S.current]||!S.teams[S.current].cloud)) S.current=ids.includes(last)?last:ids[0];
  }catch(e){ toast(`Couldn’t load your teams: ${friendlyErr(e)}`); }
  CLOUD.loading=false; render(); checkPendingLeague(false);
}
async function handleJoin(code){
  try{
    if(!CLOUD.uid){ const {data,error}=await CLOUD.sb.auth.signInAnonymously(); if(error) throw error; setUser(data.session); }
    const {data:tid,error}=await CLOUD.sb.rpc('join_team',{code}); if(error) throw error;
    history.replaceState(null,'',location.pathname+location.search);
    await addCloudTeam(tid,true); S.tab='next'; UI.preview=UI.preview||{}; render(); toast('You’re in. Tap your name to get started');
  }catch(e){ const m=friendlyErr(e); toast(/anonymous/i.test(m)?'The captain needs to turn on anonymous sign-ins in Supabase first.':`Couldn’t join: ${m}`); }
}
function openSignIn(why){

    <h2>Sign in</h2><p class="meta" style="margin-top:-4px">${esc(why||'Captains and league organizers sign in with email to run real teams. Players never need to sign in: they just use the invite link.')}</p>

async function sendLink(){

  modalRoot().querySelector('.modal').innerHTML=`<h2>📬 Check your email</h2><p>We sent a sign-in link to <b>${esc(em)}</b>. Open it on this device and you’ll land back here, signed in.</p><div class="actions" style="justify-content:flex-end"><button class="btn primary" data-act="close">OK</button></div>`;

async function signOut(){
  await CLOUD.sb.auth.signOut(); Object.values(CLOUD.chans).forEach(ch=>{ try{ CLOUD.sb.removeChannel(ch); }catch(e){} }); CLOUD.chans={};
  S.order.filter(id=>S.teams[id]&&S.teams[id].cloud).forEach(id=>{ delete S.teams[id]; delete S.avail[id]; }); S.order=S.order.filter(id=>S.teams[id]);

async function createCloudTeam(nt){

/* ---------- start up ---------- */
async function cloudInit(){
  if(!window.supabase||!window.supabase.createClient) return;   // offline or the library didn't load: demo still works
  if(/claude\.ai|claudeusercontent|usercontent\.goog/.test(location.host)) return;   // preview sandbox can't reach Supabase: demo only
  try{ CLOUD.sb=window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}}); }catch(e){ return; }
  const join=/[#&]join=([a-z0-9]+)/i.exec(location.hash);
  const {data}=await CLOUD.sb.auth.getSession(); setUser(data&&data.session);
  CLOUD.sb.auth.onAuthStateChange((ev,session)=>{ const before=CLOUD.uid; setUser(session); if(ev==='SIGNED_IN'&&session&&session.user.id!==before) loadMyTeams(); });
  const lg=/[#&]league=([a-z0-9]+)/i.exec(location.hash); if(lg){ try{ localStorage.setItem('hc-pending-league',lg[1]); }catch(e){} history.replaceState(null,'',location.pathname+location.search); }

/* ---------- photos ---------- */
function photoUrl(t,p){ if(p.photo) return p.photo; if(t.cloud&&p.photoV) return `${SB_URL}/storage/v1/object/public/avatars/${t.id}/${p.id}.jpg?v=${p.photoV}`; return null; }
function avatar(t,p,size=24){
  const u=photoUrl(t,p), ini=(((p.first||'?')[0]||'')+((p.last||'')[0]||'')).toUpperCase();
  return u?`<img class="av" src="${esc(u)}" alt="" width="${size}" height="${size}" style="width:${size}px;height:${size}px" loading="lazy">`
    :`<span class="av ini" aria-hidden="true" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.4)}px">${esc(ini)}</span>`;
}
function resizeImage(file,size){ return new Promise((res,rej)=>{ const img=new Image(), url=URL.createObjectURL(file);
  img.onload=()=>{ const c=document.createElement('canvas'); c.width=c.height=size; const s=Math.min(img.width,img.height);
    c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size); URL.revokeObjectURL(url);
    c.toBlob(b=>b?res({blob:b, dataUrl:c.toDataURL('image/jpeg',.8)}):rej(new Error('Couldn’t read that image')),'image/jpeg',.82); };
  img.onerror=()=>rej(new Error('That file isn’t an image I can read')); img.src=url; }); }
async function setPhoto(t,p,file){

      const {data,error}=await CLOUD.sb.rpc('set_photo',{p:p.id}); if(error) throw error; p.photoV=data; }
    else p.photo=dataUrl;
    save(); closeModal(); render(); toast('Photo updated 📸');

}
async function clearPhoto(t,p){ if(t.cloud){ const {error}=await CLOUD.sb.rpc('clear_photo',{p:p.id}); if(error){ toast(friendlyErr(error)); return; } p.photoV=0; } else delete p.photo; save(); closeModal(); render(); toast('Photo removed'); }

  return `<div class="card">${cardHd(`${esc(s.season)} · archived`, `<span class="meta">Record <b>${w}–${l}${d||sp.ties?'–'+d:''}</b></span>`)}${seasonPills(t)}
    ${games.map(g=>{const r=g.final?resultOf(t,g):null;return `<div class="game ours"><div class="when"><b>${fmtDate(g.date)}</b>${esc((g.venue||'').split(',')[0])}</div>
      <div class="teamsx"><div><span>${g.home===t.name?'vs':'@'} ${esc(oppOf(t,g))}</span><span>${r?`<b class="res ${r.l}">${r.l}</b> ${r.us}–${r.them}`:g.cancelled?'Cancelled':'–'}</span></div></div>
      ${g.final?`<span class="gacts"><button class="btn small" data-act="recapgame" data-v="${g.id}">📣 Recap</button></span>`:''}</div>`}).join('')||'<p class="meta">No games that season.</p>'}</div>`;

function seasonPills(t){ if(!(t.past||[]).length) return ''; const cur=UI.seasonView||t.season;
  return `<div class="divpills" role="tablist" aria-label="Season">${[t.season,...t.past.map(s=>s.season)].map((n,i)=>`<button role="tab" aria-selected="${n===cur}" class="${n===cur?'on':''}" data-act="seasonview" data-v="${esc(n)}">${esc(n)}${i===0?' · now':''}</button>`).join('')}</div>`; }
function seedPast(t,seed){
  const R=rng(seed), sp=SPORTS[t.sport], s=makeSeasonNames(t.teams, t.sport, seed);
  s.games.forEach(g=>{ const d=parseISO(g.date); d.setDate(d.getDate()-182); g.date=isoOf(d); g.id=uid(); if(!g.final) Object.assign(g, scoreGame(t.sport,R), {final:true}); });
  const tmp={...t, games:s.games, stats:{}}; genStats(tmp, seed+5); Object.assign(t.stats, tmp.stats);
  const m=/(\d{4})/.exec(t.season||'')||[0,new Date().getFullYear()];

/* ---------- export ---------- */
function toCsv(rows){ return rows.map(r=>r.map(v=>{ const x=v==null?'':String(v); return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x; }).join(',')).join('\n'); }
function statsCsv(t,career){
  const sp=SPORTS[t.sport], st=sp.stats, kp=st.keeper, ss=career?careerStats(t):seasonStats(t);
  const block=(cfg,rows)=>[['First name','Last name','Position','GP',...cfg.fields.map(f=>f[1]),...cfg.calc.map(c=>c[0])],
    ...rows.map(r=>[r.p.first,r.p.last,posName(t,r.p.pos),r.gp,...cfg.fields.map(f=>r[f[0]]),...cfg.calc.map(c=>c[1](r,r.gp))])];
  const out=[[`${t.name} · ${career?'Career':t.season} stats`],[] ,...block(st,ss.sk)];
  if(kp&&ss.gk.length) out.push([],[kp.label],...block(kp,ss.gk));
  return toCsv(out);
}
function scheduleCsv(t){
  return toCsv([['Round','Date','Time','Venue','Home','Away','Home score','Away score','Status'],
    ...t.games.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(g=>[g.round,g.tbd?'TBD':g.date,g.time,g.venue,g.home,g.away,g.final?g.hs:'',g.final?g.as:'',g.cancelled?'Cancelled':g.tbd?'Postponed':g.final?'Final':'Scheduled'])]);
}

function downloadFile(){ const f=UI.file; if(!f) return; try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+f.text],{type:'text/csv;charset=utf-8'})); a.download=f.name; document.body.appendChild(a); a.click(); a.remove(); toast(`Downloading ${f.name}. If nothing happens, use Copy as text.`); }catch(e){ toast('This browser blocked the download. Use Copy as text instead.'); } }

/* ---------- game recap for the group chat ---------- */
function recapFor(t,g){
  const sp=SPORTS[t.sport], r=resultOf(t,g), line=(t.stats||{})[g.id]||{}, nm=id=>{ const p=pById(t,id); return p?shortName(p):'?'; };
  const sk=Object.entries(line).filter(([k])=>!k.startsWith('k:')&&!(sp.stats.keeper&&!sp.stats.keeper.both&&(pById(t,k)||{}).pos===sp.stats.keeper.pos));
  const list=(key,mult=true)=>sk.filter(([,o])=>(o[key]||0)>0).sort((a,b)=>b[1][key]-a[1][key]).map(([id,o])=>`${nm(id)}${mult&&o[key]>1?` ×${o[key]}`:''}`).join(', ');
  const top=(key,n=3)=>sk.filter(([,o])=>(o[key]||0)>0).sort((a,b)=>b[1][key]-a[1][key]).slice(0,n).map(([id,o])=>`${nm(id)} ${o[key]}`).join(', ');
  const out=[`${sp.emoji} ${r.l==='W'?'WIN':r.l==='L'?'Loss':'Draw'} ${r.us}–${r.them} ${g.home===t.name?'vs':'@'} ${oppOf(t,g)}${g.ot?' (OT)':''}`];
  const add=(label,v)=>{ if(v) out.push(`${label}: ${v}`); };
  if(t.sport==='hockey'||t.sport==='soccer'){ add('Goals',list('g')); add('Assists',list('a')); }
  if(t.sport==='rugby'){ add('Tries',list('tr')); const k=sk.filter(([,o])=>o.con||o.pen).map(([id,o])=>`${nm(id)} ${[o.con?`${o.con} con`:'',o.pen?`${o.pen} pen`:''].filter(Boolean).join(', ')}`).join('; '); add('Kicking',k); }
  if(t.sport==='basketball'){ add('Top scorers',top('pts')); add('Boards',top('reb',2)); }
  if(t.sport==='football'){ add('Touchdowns',list('td')); add('Picks',list('int')); }
  if(t.sport==='baseball'){ add('Home runs',list('hr')); add('RBIs',top('rbi')); }
  const kp=sp.stats.keeper;
  if(kp){ Object.entries(line).filter(([k])=>kp.both?k.startsWith('k:'):(pById(t,k)||{}).pos===kp.pos).forEach(([k,o])=>{ const id=k.replace('k:','');
    if(t.sport==='hockey') out.push(`🥅 ${nm(id)}: ${o.sv||0} saves${(o.ga||0)===0?', SHUTOUT':''}`);
    if(t.sport==='soccer') out.push(`🧤 ${nm(id)}: ${(o.ga||0)===0?'clean sheet':`${o.sv||0} saves`}`);
    if(t.sport==='baseball'&&o.ip) out.push(`⚾ ${nm(id)}: ${o.ip} IP, ${o.k||0} K`); }); }
  const m=mvpOf(t,g.id); if(m&&m.p) out.push(`🏆 MVP: ${shortName(m.p)} (${m.n} vote${m.n>1?'s':''})`);
  const nx=nextGame(t); if(nx) out.push(`Next up: ${fmtDate(nx.date)}, ${nx.time} ${nx.home===t.name?'vs':'@'} ${oppOf(t,nx)}`);
  out.push('', 'Who’s in? 👉 Headcount');
  return out.join('\n');
}
function openGameRecap(t,gid){
  const g=findGame(t,gid)||(t.past||[]).flatMap(s=>s.games).find(x=>x.id===gid); if(!g) return; const text=recapFor(t,g);
  modalRoot().innerHTML=`<div class="overlay" data-act="close"><div class="modal recapm" role="dialog" aria-modal="true" style="max-width:440px">
    <h2>📣 Game recap</h2><p class="meta" style="margin-top:-6px">Ready to paste in the group chat.</p>
    <div class="recaptext">${esc(text)}</div><textarea id="gameRecapText" hidden>${esc(text)}</textarea>
    <div class="actions" style="justify-content:flex-end"><button class="btn" data-act="close">Close</button><button class="btn primary" data-act="copytext" data-v="gameRecapText">Copy recap</button></div></div></div>`;
}

async function cloudNotify(t,body,ok){
  try{ const {data,error}=await CLOUD.sb.functions.invoke('send-reminders',{body:{...body, team_id:t.id}});
    if(error){ let msg=null; try{ const j=await error.context.json(); msg=j&&j.error; }catch(e){} if(msg&&error.context.status!==404) throw new Error(msg); throw error; }
    if(data&&data.error) throw new Error(data.error); toast(ok(data||{}));
  }catch(e){ const m=(e&&e.message)||''; toast(/not found|404|Failed to send|FunctionsFetchError|FunctionsHttpError|relay/i.test(m)?'Email isn’t switched on yet. See “Reminder emails” in the README.':`Couldn’t send: ${friendlyErr(e)}`); }
}

/* ---------- actions ---------- */
const _extraAct2b=extraAct2;
extraAct2=function(act,v,el,t,e){
  const g=nextGame(t);
  switch(act){
    case 'guest': openGuest(t,g); return false;
    case 'guestsave': { const q=id=>document.getElementById(id).value.trim(), f=q('gFirst');
      if(!f){ document.getElementById('err').textContent='Add at least a first name.'; return false; }
      const p={id:uid(), first:f, last:q('gLast'), pos:document.getElementById('gPos').value, sub:true, guest:v, num:null};
      t.players.push(p); availFor(t,findGame(t,v))[p.id]='in'; closeModal(); toast(`${f} added for this game 🎟️`); return true; }
    case 'photo': pickPhoto(v); return false;
    case 'photoclear': clearPhoto(t,pById(t,v)); return false;
    case 'venueedit': openVenue(t,v); return false;
    case 'venuesave': { const note=document.getElementById('vNote').value.trim(), map=document.getElementById('vMap').value.trim();
      if(map&&!/^https:\/\//i.test(map)){ document.getElementById('err').textContent='Map links start with https://'; return false; }
      t.venues ||= {}; if(note||map) t.venues[v]={note,map}; else delete t.venues[v]; closeModal(); toast('Venue tips saved'); return true; }
    case 'seasonview': UI.seasonView=v===t.season?null:v; return true;
    case 'career': UI.career=v==='1'; return true;
    case 'newseason': openNewSeason(t); return false;
    case 'nsgo': { const name=document.getElementById('nsName').value.trim();
      if(!name){ document.getElementById('err').textContent='Give the season a name.'; return false; }
      if(name===t.season||(t.past||[]).some(s=>s.season===name)){ document.getElementById('err').textContent='You’ve already used that name.'; return false; }
      snap(); t.past=[{season:t.season, games:t.games.map(x=>({...x, div:t.divId}))}, ...(t.past||[])];
      t.divs.forEach(d=>{ t.past[0].games.push(...d.games.map(x=>({...x, div:d.id}))); d.games=[]; });
      t.games=[]; t.season=name; t.playoffs={byDiv:{}}; t.dues.paid={}; t.lineups={}; t.live=null; UI.seasonView=null;
      closeModal(); S.tab='schedule'; save(); render(); toastUndo(`${name} started. Build the schedule next`); openBuilder(); return false; }
    case 'exportstats': offerFile(`${t.name.replace(/\W+/g,'-')}-${UI.career?'career':'stats'}.csv`, statsCsv(t,UI.career), UI.career?'career stats':'season stats'); return false;
    case 'exportsched': offerFile(`${t.name.replace(/\W+/g,'-')}-schedule.csv`, scheduleCsv(t), 'schedule'); return false;
    case 'dlfile': downloadFile(); return false;
    case 'recapgame': openGameRecap(t,v); return false;
    case 'theme': { const nx=document.documentElement.dataset.theme==='light'?'dark':'light'; try{ localStorage.setItem('hc-theme',nx); }catch(e){} applyTheme(); UI.menu=false; return true; }
    case 'leagueinvite': openLeagueInvite(t); return false;
    case 'leaguenewcode': if(el.dataset.ok!=='1'){ el.dataset.ok='1'; el.textContent='Tap again: the old link stops working'; return false; }
      CLOUD.sb.rpc('reset_league_invite',{l:t.leagueId}).then(({error})=>{ if(error){ toast(friendlyErr(error)); return; } openLeagueInvite(t); toast('New league link made'); }); return false;
    case 'jlcancel': UI.leagueOpen=false; try{ localStorage.removeItem('hc-pending-league'); }catch(e2){} closeModal(); return false;
    case 'jlgo': { const name=document.getElementById('jlName').value.trim(), err=document.getElementById('err'); if(!name){ err.textContent='Name your team.'; return false; }
      const dv=document.getElementById('jlDiv'), fm=document.getElementById('jlFmt'); err.textContent='Adding your team…';
      CLOUD.sb.rpc('join_league',{code:v, team_name:name, div:dv?dv.value:null, fmt:fm?fm.value:null}).then(async({data,error})=>{
        if(error){ err.textContent=friendlyErr(error); return; }
        try{ localStorage.removeItem('hc-pending-league'); }catch(e2){} UI.leagueOpen=false;
        const nt=await addCloudTeam(data,true); S.tab='roster'; closeModal(); render(); openPaste(nt,1); }); return false; }
    case 'cocap': { const p=pById(t,v), want=!isCoCap(t,p);
      if(t.cloud){ CLOUD.sb.rpc('set_member_role',{t:t.id, p:v, r:want?'captain':'player'}).then(({error})=>{ if(error){ toast(friendlyErr(error)); return; } toast(want?`${p.first} is now a co-captain 👑`:`${p.first} is back to player`); refreshTeam(t.id,true); }); closeModal(); return false; }
      p.cocap=want; closeModal(); toast(want?`${p.first} is now a co-captain 👑 (demo: they’d use the captain PIN)`:`${p.first} is back to player`); return true; }
  }
  if(t&&t.cloud){
    if(act==='duesnudge'){ cloudNotify(t,{mode:'dues'},d=>d.sent?`Dues reminder emailed to ${d.sent} player${d.sent>1?'s':''}`:'Nobody to remind (paid up, or no emails on file)'); return false; }
    if(act==='calendar'){ openCloudCalendar(t); return false; }
  }
  return _extraAct2b(act,v,el,t,e);
};

/* ---------- live pulse: flash rows that changed on someone else's phone ---------- */
if(typeof refreshTeam==='function'){
  const _refresh=refreshTeam;
  refreshTeam=async function(id,force){
    const t=S.teams[id], g=t&&nextGame(t), before=g?{...(S.avail[id]||{})[g.id]||{}}:{};
    await _refresh(id,force);
    const t2=S.teams[id], g2=t2&&nextGame(t2); if(!g2||!g||g2.id!==g.id||S.current!==id) return;
    const after=(S.avail[id]||{})[g2.id]||{}, changed=Object.keys({...before,...after}).filter(pid=>before[pid]!==after[pid]&&pid!==S.me[id]);
    changed.forEach(pid=>document.querySelectorAll(`[data-pid="${pid}"]`).forEach(el=>{ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }));
    if(changed.length===1){ const p=pById(t2,changed[0]), st=after[changed[0]]; if(p) toast(`${shortName(p)} ${st==='in'?'is in ✅':st==='out'?'is out ❌':st==='maybe'?'is a maybe 🤷':'cleared their reply'}`); }
    else if(changed.length>1) toast(`${changed.length} players just updated`);
  };
}

/* ---------- position colours ---------- */
const POS_HUES=[265,200,145,25,330,50,175,290,95,5];
function posHue(t,code){ const i=SPORTS[t.sport].positions.findIndex(p=>p[0]===code); return POS_HUES[(i<0?0:i)%POS_HUES.length]; }
posChip=function(t,p){ const on=t.posColors!==false, spec=specSet(SPORTS[t.sport]).has(p.pos);
  return `<span class="pos ${on?'hue':spec?'spec':''}" ${on?`style="--h:${posHue(t,p.pos)}"`:''} title="${esc(posName(t,p.pos))}"><span class="pl">${esc(posName(t,p.pos))}</span><span class="ps">${esc(p.pos)}</span></span>`; };

/* ---------- team jersey colours ---------- */
const JERSEY_DEFAULT={home:{c:'#7a4bd9',n:'Purple'}, away:{c:'#f3effb',n:'White'}};
function jerseys(t){ return {home:{...JERSEY_DEFAULT.home,...((t.jerseys||{}).home||{})}, away:{...JERSEY_DEFAULT.away,...((t.jerseys||{}).away||{})}}; }
kitFor=function(t,g){ const k=t.kit[g.id]; return k==='home'||k==='away'?k:k==='dark'?'home':k==='light'?'away':(g.home===t.name?'home':'away'); };
const DEMO_KITS=[['#1f6feb','Blue'],['#d23a3a','Red'],['#2f9e44','Green'],['#f2c12e','Gold'],['#111111','Black'],['#f08c00','Orange'],['#7a4bd9','Purple'],['#0ca5a5','Teal']];
function demoJersey(name){ let h=0; for(const ch of name) h=(h*31+ch.charCodeAt(0))>>>0; const k=DEMO_KITS[h%DEMO_KITS.length]; return {home:{c:k[0],n:k[1]}, away:{c:'#f3effb',n:'White'}}; }
function hexDist(a,b){ const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)); try{ const x=p(a), y=p(b); return Math.sqrt(x.reduce((s,v,i)=>s+(v-y[i])**2,0)); }catch(e){ return 999; } }
kitLine=function(t,g){
  const k=kitFor(t,g), J=jerseys(t)[k], opp=oppOf(t,g), oj=(t.oppJerseys||{})[opp]||(t.cloud?null:demoJersey(opp)), ok=oj?(oj[g.home===opp?'home':'away']||JERSEY_DEFAULT[g.home===opp?'home':'away']):null;
  const clash=ok&&hexDist(J.c,ok.c)<90;
  return `<div class="kit"><span class="sw" style="background:${esc(J.c)}" aria-hidden="true"></span><span>Wear <b>${esc(J.n)}</b> <span class="meta">(${k})</span>${ok?` · ${esc(opp)} <span class="nw">in <span class="sw sm" style="background:${esc(ok.c)}" aria-hidden="true"></span>${esc(ok.n)}</span>`:''}</span>
    ${clash?'<span class="gtag warn">Colour clash</span>':''}${isCap()?`<button class="link" data-act="kitswap">Wear ${k==='home'?'away':'home'} instead</button>`:''}</div>`;
};
function jerseyFields(t){ const J=jerseys(t);
  return `<div class="fld"><span>Jerseys</span><div class="jrows">${['home','away'].map(k=>`<div class="jrow"><span class="jlab">${k==='home'?'Home':'Away'}</span>
    <input type="color" class="jcol" id="j_${k}_c" value="${esc(J[k].c)}" aria-label="${k} jersey colour"><input class="inp" id="j_${k}_n" maxlength="20" value="${esc(J[k].n)}" aria-label="${k} jersey name"></div>`).join('')}</div></div>
    <label class="chk" style="margin:-4px 0 12px"><input type="checkbox" id="stPosCol" ${t.posColors!==false?'checked':''}> Colour-code positions</label>`; }

/* ---------- MVP: everyone on the roster (plus that night's guests) ---------- */
mvpCard=function(t,me){
  const g=lastFinal(t); if(!g||!me) return '';
  const votes=t.mvp[g.id]||{}, mine=votes[me.id], r=resultOf(t,g);
  const cand=sortPlayers(t,forGame(t,g)).filter(p=>p.id!==me.id), tallyV={};
  Object.values(votes).forEach(id=>tallyV[id]=(tallyV[id]||0)+1);
  const lead=Object.entries(tallyV).sort((a,b)=>b[1]-a[1])[0];
  return `<div class="card">${cardHd(`🏆 MVP vote · ${r.l} ${r.us}–${r.them} ${g.home===t.name?'vs':'@'} ${esc(oppOf(t,g))}`)}
    ${mine?`<p style="margin:0">You voted for <b>${esc(fullName(pById(t,mine)||{first:'?',last:''}))}</b>.${lead?` Leading: <b>${esc(shortName(pById(t,lead[0])))}</b> with ${lead[1]} vote${lead[1]>1?'s':''}.`:''}</p><button class="link" data-act="mvpundo" data-v="${g.id}">Change my vote</button>`
      :`<p class="meta" style="margin:0 0 10px">Who was the best player last game? Anyone on the team counts. You can’t vote for yourself.</p><div class="who">${cand.map(p=>`<button data-act="mvp" data-g="${g.id}" data-v="${p.id}"><span class="whohd">${avatar(t,p,26)}<span>${esc(fullName(p))}</span></span><span>${esc(posName(t,p.pos))}${playedIn(t,g.id,p.id)?'':' · didn’t play'}</span></button>`).join('')}</div>`}
  </div>`;
};

/* ---------- manual schedule entry: one game, or paste a list ---------- */
const MONTHS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function pickYear(m,d){ const now=new Date(); let y=now.getFullYear(); const c=new Date(y,m,d); if((now-c)/864e5>60) y++; return y; }
function parseGameLine(t,raw){
  let s=' '+raw.replace(/\s+/g,' ').trim()+' ', date=null, time=null, away=false, opp='', venue='';
  let m=/\b(\d{4})-(\d{1,2})-(\d{1,2})\b/.exec(s);
  if(m){ date=`${m[1]}-${pad(+m[2])}-${pad(+m[3])}`; s=s.replace(m[0],' '); }
  if(!date&&(m=/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/.exec(s))){ const mo=+m[1]-1, d=+m[2]; let y=m[3]?+m[3]:pickYear(mo,d); if(y<100) y+=2000; if(mo>=0&&mo<12&&d>0&&d<32) date=`${y}-${pad(mo+1)}-${pad(d)}`; s=s.replace(m[0],' '); }
  if(!date&&(m=new RegExp(`\\b(${MONTHS.join('|')})[a-z]*\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?(?:,?\\s*(\\d{4}))?`,'i').exec(s))){ const mo=MONTHS.indexOf(m[1].toLowerCase().slice(0,3)), d=+m[2], y=m[3]?+m[3]:pickYear(mo,d); date=`${y}-${pad(mo+1)}-${pad(d)}`; s=s.replace(m[0],' '); }
  if(!date&&(m=new RegExp(`\\b(\\d{1,2})(?:st|nd|rd|th)?\\s+(${MONTHS.join('|')})[a-z]*\\.?(?:,?\\s*(\\d{4}))?`,'i').exec(s))){ const mo=MONTHS.indexOf(m[2].toLowerCase().slice(0,3)), d=+m[1], y=m[3]?+m[3]:pickYear(mo,d); date=`${y}-${pad(mo+1)}-${pad(d)}`; s=s.replace(m[0],' '); }
  s=s.replace(/\b(mon|tue|wed|thu|fri|sat|sun)[a-z]*\.?,?\s/ig,' ');
  if((m=/\b(\d{1,2})(?::(\d{2}))?\s*(a\.?m\.?|p\.?m\.?)/i.exec(s))){ let h=+m[1]%12; if(/p/i.test(m[3])) h+=12; time=`${h%12||12}:${m[2]||'00'} ${h>=12?'PM':'AM'}`; s=s.replace(m[0],' '); }
  else if((m=/\b([01]?\d|2[0-3]):([0-5]\d)\b/.exec(s))){ const h=+m[1]; time=`${h%12||12}:${m[2]} ${h>=12?'PM':'AM'}`; s=s.replace(m[0],' '); }
  if((m=/(?:^|\s)(vs\.?|v\.?|versus|@|at)\s+(.+)$/i.exec(s))){ away=/^(@|at)$/i.test(m[1]); let rest=m[2];
    const cut=/\s*(,|\s-\s|\s–\s|\s—\s|\s\|\s|\(|\sat\s|\s@\s)/i.exec(rest);
    if(cut){ opp=rest.slice(0,cut.index); venue=rest.slice(cut.index+cut[0].length).replace(/[()]/g,'').replace(/^(at|@)\s+/i,''); } else opp=rest; }
  opp=opp.replace(/[,|-]+$/,'').trim(); venue=venue.replace(/^[,|\-–— ]+|[,|\-–— ]+$/g,'').trim();
  const known=t.teams.find(n=>n.toLowerCase()===opp.toLowerCase()); if(known) opp=known;
  return {date, time:time||(t.games[0]||{}).time||'7:00 PM', away, opp, venue:venue||(t.games.find(g=>ours(t,g))||{}).venue||'', guessedTime:!time};
}
function renumberRounds(t){
  const dates=[...new Set(t.games.map(g=>g.date))].sort();
  t.games.forEach(g=>g.round=dates.indexOf(g.date)+1);
}
let AG=null;
function openAddGames(t){ AG={mode:'one', rows:null, text:''}; renderAddGames(); }
function renderAddGames(){
  const t=team(), opps=t.teams.filter(n=>n!==t.name), venues=[...new Set(t.games.map(g=>g.venue).filter(Boolean))];
  const lists=`<datalist id="oppList">${opps.map(n=>`<option value="${esc(n)}">`).join('')}</datalist><datalist id="venueList">${venues.map(v=>`<option value="${esc(v)}">`).join('')}</datalist>`;
  const tabs=`<div class="divpills" role="tablist"><button role="tab" aria-selected="${AG.mode==='one'}" class="${AG.mode==='one'?'on':''}" data-act="agmode" data-v="one">One game</button><button role="tab" aria-selected="${AG.mode==='paste'}" class="${AG.mode==='paste'?'on':''}" data-act="agmode" data-v="paste">Paste a schedule</button></div>`;
  let body='';
  if(AG.mode==='one') body=`<div class="fld2"><label class="fld"><span>Date</span><input class="inp" type="date" id="agDate"></label><label class="fld"><span>Time</span><input class="inp" type="time" id="agTime" value="19:00"></label></div>
    <div class="fld2"><label class="fld"><span>Opponent</span><input class="inp" id="agOpp" list="oppList" maxlength="40" placeholder="Team name"></label>
      <label class="fld"><span>Home or away</span><select class="inp" id="agHA"><option value="home">Home (vs)</option><option value="away">Away (@)</option></select></label></div>
    <label class="fld"><span>Venue</span><input class="inp" id="agVenue" list="venueList" maxlength="60" value="${esc(venues[0]||'')}"></label>`;
  else if(!AG.rows) body=`<p class="meta" style="margin-top:0">Paste the schedule your league sent, one game per line. Dates like <b>Nov 27</b>, <b>11/27</b> or <b>2026-11-27</b>, a time, then <b>vs</b> or <b>@</b> and the other team. Add the venue after a comma if you like.</p>
    <textarea class="inp" id="agPaste" rows="8" style="width:100%" placeholder="Thu Nov 27 8:30 PM vs Sin Bin Sinners, Northside Arena\nDec 4 9:45pm @ Zamboni Drivers\n12/11 11:00 PM vs Cold Ones">${esc(AG.text)}</textarea>`;
  else body=`<p class="meta" style="margin-top:0">${AG.rows.length} game${AG.rows.length===1?'':'s'} found. Check them, then add. Yellow = a guess.</p>
    <div class="agtable">${AG.rows.map((r,i)=>`<div class="agrow"><input class="inp mini ${r.date?'':'guess'}" type="date" data-ag="${i}" data-k="date" value="${r.date||''}" aria-label="Date"><input class="inp mini ${r.guessedTime?'guess':''}" data-ag="${i}" data-k="time" value="${esc(r.time)}" aria-label="Time">
      <select class="inp mini" data-ag="${i}" data-k="away" aria-label="Home or away"><option value="0" ${r.away?'':'selected'}>vs</option><option value="1" ${r.away?'selected':''}>@</option></select>
      <input class="inp mini ${r.opp?'':'guess'}" list="oppList" data-ag="${i}" data-k="opp" value="${esc(r.opp)}" aria-label="Opponent"><input class="inp mini" list="venueList" data-ag="${i}" data-k="venue" value="${esc(r.venue)}" aria-label="Venue"></div>`).join('')}</div>`;
  const btns=AG.mode==='one'?'<button class="btn primary" data-act="agone">Add game</button>':!AG.rows?'<button class="btn primary" data-act="agparse">Next</button>':`<button class="btn" data-act="agback">Back</button><button class="btn primary" data-act="agaddall">Add ${AG.rows.length} game${AG.rows.length===1?'':'s'}</button>`;
  modalRoot().innerHTML=`<div class="overlay" data-act="close"><div class="modal" role="dialog" aria-modal="true" style="max-width:640px">
    <h2>＋ Add games</h2>${tabs}${body}${lists}<div class="err" id="err"></div>
    <div class="actions" style="justify-content:flex-end"><button class="btn" data-act="close">Cancel</button>${btns}</div></div></div>`;
}
function addGamesTo(t,list){
  list.forEach(r=>{ const opp=r.opp.trim(); if(!t.teams.includes(opp)) t.teams.push(opp);
    t.games.push({id:uid(), round:1, date:r.date, time:r.time, venue:r.venue.trim(), home:r.away?opp:t.name, away:r.away?t.name:opp, final:false}); });
  renumberRounds(t);
}

/* ---------- actions ---------- */
const _extraAct2c=extraAct2;
extraAct2=function(act,v,el,t,e){
  switch(act){
    case 'addgames': openAddGames(t); return false;
    case 'agmode': AG.mode=v; AG.rows=null; renderAddGames(); return false;
    case 'agone': { const q=id=>document.getElementById(id).value.trim(), err=document.getElementById('err'), d=q('agDate'), tm=q('agTime'), opp=q('agOpp');
      if(!d) return err.textContent='Pick a date.', false; if(!opp) return err.textContent='Who are you playing?', false;
      if(opp.toLowerCase()===t.name.toLowerCase()) return err.textContent='That’s your own team.', false;
      const [h,mi]=(tm||'19:00').split(':').map(Number), away=q('agHA')==='away'; snap();
      addGamesTo(t,[{date:d, time:`${h%12||12}:${pad(mi)} ${h>=12?'PM':'AM'}`, away, opp, venue:q('agVenue')}]);
      closeModal(); S.tab='schedule'; toastUndo(`Game added: ${fmtDate(d)} ${away?'@':'vs'} ${opp}`); return true; }
    case 'agparse': { AG.text=document.getElementById('agPaste').value; const rows=AG.text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>parseGameLine(t,l));
      if(!rows.length){ document.getElementById('err').textContent='Paste at least one game.'; return false; } AG.rows=rows; renderAddGames(); return false; }
    case 'agback': AG.rows=null; renderAddGames(); return false;
    case 'agaddall': { document.querySelectorAll('[data-ag]').forEach(i=>{ const r=AG.rows[+i.dataset.ag], k=i.dataset.k; r[k]=k==='away'?i.value==='1':i.value.trim(); });
      const bad=AG.rows.findIndex(r=>!r.date||!r.opp); if(bad>=0){ document.getElementById('err').textContent=`Line ${bad+1} needs a date and an opponent.`; return false; }
      const tf=AG.rows.find(r=>!/^\d{1,2}:\d{2} (AM|PM)$/.test(r.time)); if(tf){ document.getElementById('err').textContent=`Write times like 8:30 PM (line ${AG.rows.indexOf(tf)+1}).`; return false; }
      snap(); addGamesTo(t,AG.rows); const n=AG.rows.length; AG=null; closeModal(); S.tab='schedule'; toastUndo(`${n} game${n>1?'s':''} added to the schedule`); return true; }
  }
  return _extraAct2c(act,v,el,t,e);
};

/* ================= round 10: team pages other teams can see ================= */
const VENUE_WORD={hockey:'rink',rugby:'pitch',soccer:'field',basketball:'court',football:'field',baseball:'diamond'};
function venueWord(t){ return VENUE_WORD[t.sport]||'venue'; }
function nameHash(s){ let h=0; for(const ch of String(s)) h=(h*31+ch.charCodeAt(0))>>>0; return h; }
function profileOf(t){ return {home:'', coaches:'', about:'', contactName:'', contact:true, showRoster:true, ...(t.profile||{})}; }
function divOfTeam(t,name){ return allDivs(t).find(d=>d.teams.includes(name))||allDivs(t).find(d=>d.mine); }
function formOf(t,d,name){ return d.games.filter(g=>g.final&&!g.cancelled&&(g.home===name||g.away===name)).sort((a,b)=>a.date.localeCompare(b.date)).slice(-5)
  .map(g=>{ const us=g.home===name?g.hs:g.as, them=g.home===name?g.as:g.hs; return us>them?'W':us<them?'L':'D'; }); }
function usualHome(t,d,name){ const c={}; d.games.filter(g=>g.home===name&&g.venue).forEach(g=>c[g.venue]=(c[g.venue]||0)+1); return (Object.entries(c).sort((a,b)=>b[1]-a[1])[0]||[''])[0]; }
function shortPublic(first,last){ return `${first} ${last?last[0]+'.':''}`.trim(); }

/* demo opponents get a made-up but stable page so the feature can be tried */
function demoTeamPage(t,name){
  const r=rng(nameHash(name)), pick=a=>a[Math.floor(r()*a.length)], sp=SPORTS[t.sport], ps=sp.positions.map(p=>p[0]);
  const roster=Array.from({length:9+Math.floor(r()*5)},(_,i)=>({first:pick(FIRST), last:pick(LAST)[0]+'.', pos:ps[Math.floor(r()*ps.length)], num:1+Math.floor(r()*98), sub:i>10}));
  const showRoster=r()>.25, about=pick(['Here for the beers, staying for the wins.','Old legs, good hands.','Undefeated in the parking lot.','New team this season. Be nice.','We bring the cooler.','']);
  return {name, jerseys:demoJersey(name), profile:{home:'', coaches:r()>.6?`${pick(FIRST)} ${pick(LAST)}`:'', about, contact:r()>.2, showRoster},
    captains:[`${pick(FIRST)} ${pick(LAST)[0]}.`], roster:showRoster?roster:null, onHeadcount:true};
}
function ownTeamPage(t){
  const pr=profileOf(t), me=pById(t,S.me[t.id]);
  return {name:t.name, jerseys:jerseys(t), profile:pr, captains:[pr.contactName||(isCap()&&me?shortPublic(me.first,me.last):'')].filter(Boolean),
    roster:pr.showRoster?sortPlayers(t,rosterOnly(t)).filter(p=>!p.hide).map(p=>({first:p.first, last:(p.last||'')[0]?p.last[0]+'.':'', pos:p.pos, num:p.num, sub:p.sub})):null,
    hidden:rosterOnly(t).filter(p=>p.hide).length, own:true, onHeadcount:true};
}

let TP=null;
async function openTeamPage(t,name){
  TP={name, data:null, loading:false, err:''};
  if(name===t.name) TP.data=ownTeamPage(t);
  else if(!t.cloud) TP.data=demoTeamPage(t,name);
  else if(!t.hcTeams[name]) TP.data={name, onHeadcount:false};
  else { TP.loading=true; renderTeamPage(); try{ const {data,error}=await CLOUD.sb.rpc('team_public',{t:t.hcTeams[name]}); if(error) throw error;
      TP.data={name, jerseys:data.jerseys?{...JERSEY_DEFAULT,...data.jerseys}:JERSEY_DEFAULT, profile:{...profileOf({}), ...(data.profile||{})}, captains:data.captains||[], roster:data.roster, onHeadcount:true}; }
    catch(e){ TP.err='Couldn’t load that team right now.'; TP.data={name, onHeadcount:true, profile:profileOf({}), captains:[], roster:null}; }
    TP.loading=false; }
  if(TP&&TP.name===name) renderTeamPage();
}
function renderTeamPage(){
  const t=team(), name=TP.name, D=TP.data, d=divOfTeam(t,name), row=standings(t,d).find(r=>r.team===name), pos=standings(t,d).findIndex(r=>r.team===name)+1;
  const sp=SPORTS[t.sport], form=formOf(t,d,name), pr=(D&&D.profile)||profileOf({}), J=D&&D.jerseys, home=pr.home||usualHome(t,d,name);
  const nextVs=name===t.name?null:t.games.filter(g=>!g.final&&!g.cancelled&&ours(t,g)&&oppOf(t,g)===name).sort((a,b)=>a.date.localeCompare(b.date))[0];
  const hh=name===t.name?null:h2h(t,name), cols=COLS[t.sport].filter(c=>['GP','P','W','L','D','T','OTL','PTS','PCT'].includes(c[0])), val=(r,k)=>typeof k==='function'?k(r):r[k];
  const sw=k=>J?`<span class="tpjersey"><span class="sw" style="background:${esc(J[k].c)}"></span>${esc(J[k].n)} <span class="meta">${k}</span></span>`:'';
  const body=TP.loading?'<p class="meta">Loading…</p>':`
    ${TP.err?`<p class="err">${esc(TP.err)}</p>`:''}
    <div class="tpstats">${row?`<div><b>${pos}${['th','st','nd','rd'][pos%10>3||[11,12,13].includes(pos%100)?0:pos%10]}</b><span>${esc(d.name)}</span></div>`+cols.map(c=>`<div><b>${val(row,c[1])}</b><span>${c[0]}</span></div>`).join(''):''}
      <div class="tpform"><b class="tpf">${form.length?form.map(x=>`<i class="f${x}">${x}</i>`).join(''):'–'}</b><span>Last ${form.length||5}</span></div></div>
    ${pr.about?`<p class="tpabout">“${esc(pr.about)}”</p>`:''}
    <div class="tpgrid">
      ${home?`<div class="tpitem"><span class="tplab">Home ${venueWord(t)}</span><a href="${esc((t.venues||{})[home]?.map||'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(home))}" target="_blank" rel="noopener">📍 ${esc(home)}</a></div>`:''}
      ${J?`<div class="tpitem"><span class="tplab">Jerseys</span><span class="tpjs">${sw('home')}${sw('away')}</span></div>`:''}
      ${D&&D.captains&&D.captains.length?`<div class="tpitem"><span class="tplab">Captain${D.captains.length>1?'s':''}</span><span>${D.captains.map(esc).join(', ')}</span></div>`:''}
      ${pr.coaches?`<div class="tpitem"><span class="tplab">Coaches</span><span>${esc(pr.coaches)}</span></div>`:''}
      ${hh?`<div class="tpitem"><span class="tplab">Vs ${esc(t.name)}</span><span>${hh.n?`${hh.w}–${hh.l}${hh.d||sp.ties?'–'+hh.d:''} all-time`:'Never played'}${nextVs?` · next ${fmtDate(nextVs.date)}`:''}</span></div>`:''}
    </div>
    ${D&&D.onHeadcount===false?'<p class="meta">This team isn’t on Headcount yet, so there’s no team page. Send their captain your league invite link.</p>':''}
    ${D&&D.onHeadcount!==false?(D.roster?`<h3 class="tph">Roster <span class="meta">${D.roster.length}</span></h3><div class="tproster">${D.roster.map(p=>`<div class="tpp"><span class="tpnum">${p.num??''}</span><span class="ell">${esc(shortPublic(p.first,p.last.replace('.','')))}${p.sub?' <span class="meta">sub</span>':''}</span>${posChip(t,p)}</div>`).join('')}</div>${D.hidden?`<p class="meta sm">${D.hidden} player${D.hidden>1?'s have':' has'} chosen not to show their name.</p>`:''}`
      :'<p class="meta">This team keeps its roster private.</p>'):''}
    ${D&&D.own&&S.me[t.id]?`<label class="chk" style="margin-top:10px"><input type="checkbox" data-act="hideme" ${pById(t,S.me[t.id])?.hide?'checked':''}> Hide my name from other teams</label>`:''}
    ${D&&D.own?`<p class="note">This is what other teams in ${esc(t.league)} see. No emails or phone numbers are ever shown.${isCap()?' Change it in <button class="link" data-act="settings">Team settings</button>.':''}</p>`:''}
    <div id="tpmsg"></div>`;
  const canMsg=D&&!D.own&&D.onHeadcount!==false&&pr.contact&&(isCap()||isOrg());
  modalRoot().innerHTML=`<div class="overlay" data-act="close"><div class="modal tpmodal" role="dialog" aria-modal="true" aria-label="${esc(name)} team page" style="max-width:560px">
    <div class="tphead" ${J?`style="--j1:${esc(J.home.c)};--j2:${esc(J.away.c)}"`:''}><span class="tpbadge">${esc(name.split(/\s+/).map(w=>w[0]).join('').slice(0,3).toUpperCase())}</span><div><h2 style="margin:0">${esc(name)}</h2><span class="meta">${esc(t.league.replace(/,?\s*Div(?:ision)?\.?\s*([A-Z]|\d+)\s*$/i,''))} · ${esc(d.name)}</span></div></div>
    ${body}
    <div class="actions" style="justify-content:flex-end">${canMsg?`<button class="btn" data-act="tpmsg">✉️ Message captain</button>`:''}<button class="btn primary" data-act="close">Done</button></div></div></div>`;
}
function openTeamMsg(){
  document.getElementById('tpmsg').innerHTML=`<label class="fld"><span>Message to ${esc(TP.name)}’s captain</span><textarea class="inp" id="tpText" rows="4" maxlength="1000" placeholder="Hey, we’re short a goalie Thursday. Got anyone?"></textarea></label>
    <p class="meta sm" style="margin:-6px 0 8px">They’ll get it by email and can reply to you directly. Your email is only shared with them.</p><div class="err" id="tpErr"></div>
    <div class="actions" style="justify-content:flex-end;margin-top:0"><button class="btn primary" data-act="tpsend">Send</button></div>`;
  document.getElementById('tpText').focus();

async function sendTeamMsg(t){
  const msg=document.getElementById('tpText').value.trim(), err=document.getElementById('tpErr');
  if(msg.length<5){ err.textContent='Write a little more first.'; return; }
  if(!t.cloud){ document.getElementById('tpmsg').innerHTML='<p class="note">📨 In a live team this emails their captain. (Demo: nothing was sent.)</p>'; return; }
  err.textContent='Sending…';
  try{ const {data,error}=await CLOUD.sb.functions.invoke('send-reminders',{body:{mode:'contact', team_id:t.id, to_team:t.hcTeams[TP.name], message:msg}});
    if(error){ let m=null; try{ m=(await error.context.json()).error; }catch(e){} throw new Error(m||'Email isn’t switched on yet for this league.'); }
    document.getElementById('tpmsg').innerHTML=`<p class="note">📨 Sent to ${esc(TP.name)}’s captain.</p>`; }
  catch(e){ err.textContent=e.message; }
}

    case 'hideme': { const p=pById(t,S.me[t.id]); if(!p) return false; p.hide=el.checked;
      if(t.cloud&&!isCap()) CLOUD.sb.rpc('set_hide_public',{p:p.id, v:p.hide}).then(({error})=>{ if(error) toast('Couldn’t save that. Try again.'); });
      toast(p.hide?'Your name is hidden from other teams':'Your name shows on the team page'); TP.data=ownTeamPage(t); renderTeamPage(); save(); return false; }
  }
  return _extraAct2d(act,v,el,t,e);
};

/* ================= round 11: add to home screen ================= */
let INSTALL_EVT=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function installDismissed(){ try{ return localStorage.getItem('hc-install-dismissed')==='1'; }catch(e){ return true; } }
function canSuggestInstall(){ return !isStandalone() && window.top===window && (INSTALL_EVT||isIOS()); }
addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); INSTALL_EVT=e; if(S.tab==='next') render(); });
addEventListener('appinstalled',()=>{ INSTALL_EVT=null; try{ localStorage.setItem('hc-install-dismissed','1'); }catch(e){} toast('Headcount is on your home screen 🎉'); render(); });
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost') && window.top===window && !/claude\.ai|anthropic|claudeusercontent/.test(location.hostname))
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

function installCard(){
  if(!canSuggestInstall()||installDismissed()||!matchMedia('(pointer:coarse)').matches) return '';
  return `<div class="card installcard"><img src="icons/icon-192.png" alt="" width="44" height="44"><div><b>Put Headcount on your home screen</b>
    <span class="meta">Opens full screen like an app, one tap from the group chat.</span></div>
    <div class="installbtns"><button class="btn primary small" data-act="install">${INSTALL_EVT?'Install':'Show me how'}</button><button class="btn small" data-act="installno" aria-label="Not now">Not now</button></div></div>`;
}
function openInstallHelp(){
  modalRoot().innerHTML=`<div class="overlay" data-act="close"><div class="modal" role="dialog" aria-modal="true" style="max-width:420px">
    <h2>Add Headcount to your home screen</h2>
    ${isIOS()?`<ol class="steps"><li>Open this page in <b>Safari</b>.</li><li>Tap the <b>Share</b> button <svg class="shareic" viewBox="0 0 24 24" aria-label="Share"><path d="M12 3.5v11M8.2 7.2 12 3.4l3.8 3.8M8.5 10.5H7A1.5 1.5 0 0 0 5.5 12v7A1.5 1.5 0 0 0 7 20.5h10a1.5 1.5 0 0 0 1.5-1.5v-7a1.5 1.5 0 0 0-1.5-1.5h-1.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg> in Safari’s toolbar. (Don’t see it? Tap <b>•••</b> first.)</li><li>Tap <b>Add to Home Screen</b>. You may need to scroll down or tap <b>More</b> to find it.</li><li>Tap <b>Add</b>. Headcount now opens full screen from its own icon.</li></ol>`
      :`<ol class="steps"><li>Open this page in <b>Chrome</b>.</li><li>Tap the <b>⋮</b> menu at the top right.</li><li>Tap <b>Add to Home screen</b> (or <b>Install app</b>).</li><li>Tap <b>Install</b>. Headcount now opens full screen from its own icon.</li></ol>`}
    <p class="meta sm">Your team, your name and your In/Out all carry over. Nothing to sign up for.</p>
    <div class="actions" style="justify-content:flex-end"><button class="btn primary" data-act="close">Got it</button></div></div></div>`;
}
const _viewNextI=viewNext;
viewNext=function(){ return installCard()+_viewNextI.apply(this,arguments); };
const _themeMenuI=themeMenu;
themeMenu=function(){ return _themeMenuI.apply(this,arguments)+(canSuggestInstall()?`<button data-act="install"><span style="font-size:20px">📱</span><span><b>Add to home screen</b><small>Opens full screen like an app</small></span></button>`:''); };
const _applyThemeI=applyTheme;
applyTheme=function(){ _applyThemeI.apply(this,arguments); const m=document.querySelector('meta[name=theme-color]'); if(m) m.content=document.documentElement.dataset.theme==='light'?'#f7f5fc':'#110c1d'; };

const _extraAct2e=extraAct2;
extraAct2=function(act,v,el,t,e){
  switch(act){
    case 'install': closeModal&&closeModal();
      if(INSTALL_EVT){ const ev=INSTALL_EVT; INSTALL_EVT=null; ev.prompt(); ev.userChoice.finally(()=>render()); } else openInstallHelp(); return false;
    case 'installno': try{ localStorage.setItem('hc-install-dismissed','1'); }catch(err){} render(); return false;
  }
  return _extraAct2e(act,v,el,t,e);
};
applyTheme();

/* ---------- load state (after every helper exists) ---------- */
try{ S=JSON.parse(localStorage.getItem(KEY)); }catch(e){ S=null; }
if(!S || !S.teams || !S.order) S=demoState();
if(!S.device) S.device='dev-'+uid();

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]');
  if(UI.menu && !e.target.closest('.menu') && !e.target.closest('[data-act="menu"]')){ UI.menu=false; if(!el){ render(); return; } }
  if(!el) return;
  const act=el.dataset.act, v=el.dataset.v, t=team();
  switch(act){
    case 'menu': UI.menu=!UI.menu; render(); return;
    case 'role': if(t.cloud){ UI.preview ||= {}; if(v==='player') UI.preview[t.id]=true; else if(t.role==='captain') UI.preview[t.id]=false; break; } if(v==='player'){ UI.unlocked[S.current]=false; break; } if(isCap()) return; openPin(); return;
    case 'pinsubmit': submitPin(); return;
    case 'builder': openBuilder(); return;
    case 'bsdraw': { readBuilder(); const inp=builderInput(); if(BS.result&&!BS.result.error) BS.seed=Math.floor(Math.random()*1e9), inp.seed=BS.seed; BS.confirm=false; BS.result=inp.error?inp:buildSchedule(inp); renderBuilder(); return; }
    case 'bsapply': { readBuilder(); const inp=builderInput(); if(inp.error){ BS.result=inp; renderBuilder(); return; }
      if(!inp.teams.includes(t.name)){ BS.result={error:`${t.name} isn’t in the team list. Add it, or rename your team in settings.`}; renderBuilder(); return; }
      if(!BS.confirm){ BS.confirm=true; renderBuilder(); return; }
      const res=buildSchedule(inp); if(res.error){ BS.result=res; renderBuilder(); return; }
      t.teams=inp.teams; t.games=res.games; t.league=BS.league.trim()||t.league; t.stats={}; S.avail[t.id]={}; S.tab='schedule';
      closeModal(); toast(`Season published: ${res.rounds} rounds starting ${fmtDate(res.games[0].date)}`); break; }
    case 'gstats': openGameStats(v); return;
    case 'savestats': saveGameStats(v); return;
    case 'statsort': { const tk=el.dataset.t, ss=(UI.statSort ||= {}), cur=ss[tk]; ss[tk]={k:v, d: cur&&cur.k===v ? -cur.d : -1}; render(); return; }
    case 'invite': openInvite(false); return;
    case 'copyinvite': { const txt=document.getElementById('inviteText').value; try{ navigator.clipboard.writeText(txt).then(()=>toast('Invite copied. Paste it in the group chat 🍻'),()=>toast('Couldn’t copy. Select the text and copy it manually.')); }catch(_){ toast('Couldn’t copy. Select the text and copy it manually.'); } return; }
    case 'team': S.current=v; UI.menu=false; break;
    case 'tab': S.tab=v; break;
    case 'me': if(!v){ if(t.claims[S.me[t.id]]===devId(t)){ delete t.claims[S.me[t.id]]; releaseClaim(t); } S.me[t.id]=null; break; } if(!pickName(t,v)) return; break;
    case 'set': { const g=nextGame(t), a=availFor(t,g), p=el.dataset.p; a[p]===v?delete a[p]:a[p]=v; break; }
    case 'nudge': { if(t.cloud){ cloudNotify(t,{mode:'nudge', game_id:nextGame(t).id},d=>d.sent?`Reminder emailed to ${d.sent} player${d.sent>1?'s':''}${d.noEmail?` (${d.noEmail} without an email)`:''}`:d.noEmail?`Nobody to email: ${d.noEmail} without an email on file`:'Everyone has replied 🙌'); return; }
      const n=headcount(t,nextGame(t)).noReply; toast(n.length?`Reminder queued for ${n.map(p=>p.first).join(', ')} (prototype, nothing sent)`:'Everyone has replied 🙌'); return; }
    case 'ping': { if(t.cloud){ cloudNotify(t,{mode:'subs', game_id:nextGame(t).id, positions:v?v.split(','):null},d=>d.name?`Emailed ${d.name}. Tap again in a couple of hours to ask the next sub`:'No subs left to ask (or none have an email). Try the League tab’s sub marketplace.'); return; }
      const a=availFor(t,nextGame(t)), want=v?v.split(','):null;
      const chk=SPORTS[t.sport].checks.find(c=>want&&c.pos.join(',')===v), fit=p=>!want||(chk&&chk.cert?!!(p.cert&&p.cert[chk.cert]):want.includes(p.pos));
      const s=t.players.filter(p=>p.sub&&!p.guest&&!a[p.id]&&fit(p)).sort((x,y)=>t.subOrder.indexOf(x.id)-t.subOrder.indexOf(y.id)), fa=(t.fa||[]).filter(x=>!want||want.includes(x.pos)).length;
      if(!s.length&&fa){ toast(`No team subs left, but ${fa} free agent${fa>1?'s':''} in the league can play. Opening the sub marketplace.`); S.tab='league'; break; }
      toast(s.length?`Asked ${s[0].first} first${s[1]?`. If no reply in 2 hours, ${s[1].first} is next`:''} (prototype, nothing sent)`:want?'No subs at that position yet. Add one on the Roster tab.':'No unpinged subs left. Add more on the Roster tab.'); return; }
    case 'showall': S.showAll=el.checked; break;
    case 'score': openScore(v); return;
    case 'savescore': saveScore(v); return;
    case 'clearscore': { snap(); const g=findGame(t,v); ['hs','as','ht','at','ot'].forEach(k=>delete g[k]); g.final=false; if(t.stats) delete t.stats[g.id]; closeModal(); toastUndo('Result cleared'); break; }
    case 'close': if(e.target===el) closeModal(); return;
    case 'togglesub': { const p=t.players.find(x=>x.id===v); p.sub=!p.sub; break; }
    case 'remove': { snap(); const p=pById(t,v); t.players=t.players.filter(x=>x.id!==v); closeModal(); toastUndo(`${p?p.first+' '+p.last:'Player'} removed`); break; }
    case 'newteam': UI.menu=false; render(); openNewTeam(); return;
    case 'ntsport': readNT(); NT.sport=v; NT.format=SPORTS[v].formats[0].v; renderNewTeam(); return;
    case 'ntcreate': { readNT(); const name=NT.name.trim();
      if(!name){ document.getElementById('err').textContent='Give your team a name.'; return; }
      if(Object.values(S.teams).some(x=>x.name.toLowerCase()===name.toLowerCase())){ document.getElementById('err').textContent='You already have a team with that name.'; return; }
      if(NT.online){ createCloudTeam({...NT, name}); return; }
      if(!/^\d{4,6}$/.test(NT.pin||'')){ document.getElementById('err').textContent='Pick a 4–6 digit captain PIN.'; return; }
      const nt=makeTeam({name, sport:NT.sport, format:NT.format, league:NT.league.trim(), pin:NT.pin, sample:NT.sample});
      S.teams[nt.id]=nt; S.order.push(nt.id); S.avail[nt.id]={}; if(NT.sample){ seedAvail(nt, S.avail[nt.id], Math.floor(Math.random()*1e6)); seedExtras(nt, S.avail[nt.id], Math.floor(Math.random()*1e6)); seedExtras2(nt, S.avail[nt.id], Math.floor(Math.random()*1e6)); ensure(nt); seedPast(nt, Math.floor(Math.random()*1e6)); } else ensure(nt);
      S.current=nt.id; UI.unlocked[nt.id]=true; S.tab=NT.sample?'next':'roster'; closeModal();
      if(NT.sample) toast(`${SPORTS[nt.sport].emoji} ${name} created with sample players and a demo schedule`); else { save(); render(); openPaste(nt,1); return; } break; }
    case 'settings': openSettings(); return;
    case 'stsave': { const name=document.getElementById('stName').value.trim(); if(!name){ document.getElementById('err').textContent='Team name can’t be empty.'; return; }
      const old=t.name; if(name!==old){ t.teams=t.teams.map(n=>n===old?name:n); t.games.forEach(g=>{ if(g.home===old) g.home=name; if(g.away===old) g.away=name; }); t.name=name; if(t.cloud){ delete t.hcTeams[old]; t.hcTeams[name]=t.id; } }
      t.league=document.getElementById('stLeague').value.trim()||t.league;
      if(!t.cloud){ const pin=document.getElementById('stPin').value.trim(); if(!/^\d{4,6}$/.test(pin)){ document.getElementById('err').textContent='PIN must be 4–6 digits.'; return; } t.pin=pin; }
      const f=document.getElementById('stFormat'); if(f) t.format=f.value;
      t.rem={hours:Number(document.getElementById('stRem').value), short:document.getElementById('stShort').checked}; const inn=document.getElementById('stInn'); if(inn) t.innLimit=Number(inn.value);
      const jv=id=>document.getElementById(id).value.trim(); t.jerseys={home:{c:jv('j_home_c'),n:jv('j_home_n')||'Home'}, away:{c:jv('j_away_c'),n:jv('j_away_n')||'Away'}};
      t.posColors=document.getElementById('stPosCol').checked;
      { const pv=id=>document.getElementById(id); t.profile={home:pv('prHome').value.trim(), contactName:pv('prContactName').value.trim(), coaches:pv('prCoaches').value.trim(), about:pv('prAbout').value.trim(), showRoster:pv('prRoster').checked, contact:pv('prContact').checked}; }
      closeModal(); toast('Team updated'); break; }
    case 'delteam': { if(el.dataset.confirm!=='1'){ el.dataset.confirm='1'; el.textContent='Tap again to delete'; return; }
      if(t.cloud){ CLOUD.sb.from('teams').delete().eq('id',t.id).then(({error})=>{ if(error) toast(friendlyErr(error)); }); }
      snap(); delete S.teams[t.id]; delete S.avail[t.id]; S.order=S.order.filter(id=>id!==t.id); S.current=S.order[0]; closeModal(); toastUndo('Team deleted'); break; }
    case 'reset': { const keep=S.order.filter(id=>S.teams[id]&&S.teams[id].cloud).map(id=>[id,S.teams[id],S.avail[id],S.me[id]]); S=demoState(); S.device=S.device||'dev-'+uid();
      keep.reverse().forEach(([id,tt,av,me])=>{ S.teams[id]=tt; S.avail[id]=av; if(me) S.me[id]=me; S.order.unshift(id); }); UI.menu=false; UI.org={}; toast('Demo teams reset'); break; }
    default: { let r=extraAct2(act,v,el,t,e); if(r===null) r=extraAct(act,v,el,t,e); if(!r) return; }
  }
  save(); render();
});
document.addEventListener('submit', e=>{
  if(e.target.id!=='addForm') return; e.preventDefault();
  const first=document.getElementById('newFirst').value.trim(), last=document.getElementById('newLast').value.trim(); if(!first||!last) return;
  const em=document.getElementById('newEmail').value.trim(); if(em&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ toast('That email doesn’t look right'); return; }
  team().players.push({id:uid(), first, last, pos:document.getElementById('newPos').value, sub:document.getElementById('newSub').checked, ...(em?{email:em}:{})});
  save(); render(); toast(`${first} ${last} added`);
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeModal(); if(UI.menu){UI.menu=false; render();} } });
render();
cloudInit();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Headcount</title>
<meta name="description" content="Who's in, who won, who's buying. A rec and beer league team manager.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%23a77bff%22/%3E%3Cstop offset=%221%22 stop-color=%22%237a4bd9%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2240%22 height=%2240%22 rx=%227%22 fill=%22url%28%23g%29%22/%3E%3Cg transform=%22translate%283 3%29 scale%28.85%29%22%3E%3Cg stroke=%22%23fff%22 stroke-width=%223.2%22 stroke-linecap=%22round%22%3E%3Cpath d=%22M11 11v18M17 11v18M23 11v18M29 11v18%22/%3E%3C/g%3E%3Cpath d=%22M7.5 25.5 32.5 14.5%22 stroke=%22%23f5b335%22 stroke-width=%223.6%22 stroke-linecap=%22round%22/%3E%3C/g%3E%3C/svg%3E" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="alternate icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#110c1d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Headcount">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#110c1d;--surface:#1a1330;--surface2:#231a3f;--line:#33285a;
  --text:#f3effb;--muted:#a79cc4;
  --violet:#9b6bff;--violet-2:#b892ff;--violet-ink:#ffffff;
  --gold:#f5b335;
  --green:#3ecf8e;--yellow:#f5d33a;--red:#ff6b7a;--blue:#7cc4ff;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif}
body{background:radial-gradient(1200px 500px at 50% -200px,#2a1a52 0%,transparent 70%),var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:780px;margin:0 auto;padding:16px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font:800 26px/1 "Bricolage Grotesque",sans-serif;margin:0;letter-spacing:-.5px}
.brand small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;color:var(--muted);font-weight:600;font-size:13.5px}
.seg button.on{background:var(--violet);color:var(--violet-ink)}
.teambar{display:flex;align-items:center;gap:10px;margin-bottom:14px;position:relative}
.teampick{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;text-align:left;flex:1;min-width:0}
.teampick:hover{border-color:#4a3b7d}
.teampick .em{font-size:24px}
.teampick b{display:block;font-size:16px}
.teampick span.lg{color:var(--muted);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.teampick .chev{margin-left:auto;color:var(--muted)}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);width:48px;height:56px;font-size:18px}
.menu{position:absolute;top:calc(100% + 6px);left:0;right:58px;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:6px;z-index:15;box-shadow:0 16px 40px rgba(0,0,0,.45)}
.menu button{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;padding:10px;border-radius:10px;text-align:left}
.menu button:hover{background:#2d2250}
.menu button.on{background:#2d2250}
.menu small{color:var(--muted);display:block;font-size:12px}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
nav.tabs{scrollbar-width:none;-webkit-overflow-scrolling:touch;position:relative;display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:10px 12px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--text);border-bottom-color:var(--violet)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{font:700 20px/1.2 "Bricolage Grotesque",sans-serif;margin:0 0 4px}
.card h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
.meta{color:var(--muted);font-size:13.5px}
.vs{font:800 24px/1.15 "Bricolage Grotesque",sans-serif;margin:6px 0}
.status{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;font-weight:700;margin:14px 0 10px}
.status.green{background:rgba(62,207,142,.12);color:var(--green)}
.status.yellow{background:rgba(245,211,58,.12);color:var(--yellow)}
.status.red{background:rgba(255,107,122,.13);color:var(--red)}
.status .dot{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.status small{display:block;font-weight:500;color:var(--muted)}
.status small+small{margin-top:3px}
.meters{display:flex;flex-wrap:wrap;gap:10px}
.meters>*{flex:1 1 140px;min-width:0}
.meter{background:var(--surface2);border-radius:12px;padding:10px 12px}
.meter .lbl{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.meter .num{font:800 22px/1.2 "Bricolage Grotesque",sans-serif}
.bar{height:6px;background:#0d0918;border-radius:6px;overflow:hidden;margin-top:6px}
.bar{display:flex}
.bar i{display:block;height:100%}
.bar i:first-child{border-radius:6px 0 0 6px}
.nin{color:var(--green)}
.nmb{color:var(--yellow);font-size:17px;margin-left:4px}
.mleg{display:flex;gap:10px;font-size:12px;font-weight:600;margin-top:6px}
.mleg .in{color:var(--green)}.mleg .maybe{color:var(--yellow)}.mleg .short{color:var(--red);margin-left:auto}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--surface2);padding:8px 13px;border-radius:10px;font-weight:600;font-size:13.5px}
.btn:hover{border-color:#4a3b7d}
.btn.primary{background:var(--violet);border-color:var(--violet);color:var(--violet-ink)}
.btn.primary:hover{background:var(--violet-2)}
.btn.danger{color:var(--red)}
.btn.small{padding:5px 10px;font-size:12.5px}

/* ---- round 5 components ---- */
.minirow{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px}
.minirow>*{flex:1 1 260px;min-width:0}
.minirow:empty{display:none}
.minirow .card{margin-bottom:0}
.duty{font-size:15px;margin-bottom:4px}
.note.remind{background:var(--surface2);border-radius:10px;padding:10px 12px;margin-top:14px;color:var(--muted)}
.note.remind b{color:var(--text)}
.chirps{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.chirp{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:baseline;background:var(--surface2);border-radius:12px;padding:9px 12px}
.chirp .who{font-weight:700;color:var(--violet-2);white-space:nowrap}
.chirp .when{font-size:12px;color:var(--muted);white-space:nowrap}
.link.x{text-decoration:none;color:var(--muted);font-size:13px}
.link.x:hover{color:var(--red)}
.chirpform input{flex:1}
.who button.locked{opacity:.6}
.lockic{font-size:11px;margin-left:5px;flex:none}
.warnc{border-color:rgba(245,211,58,.45)}
.reqrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.reqrow:first-of-type{border-top:0}
.meter.flat{margin-bottom:12px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.pill.on{background:rgba(62,207,142,.14);border-color:rgba(62,207,142,.5);color:var(--green)}
.ptable.cert{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1.25fr) 96px 72px}
.ptable.fa{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1.25fr) minmax(0,1.2fr) 64px}
.prow .c{justify-content:center}
.ck{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--green);font-weight:800}
.ck.on{background:rgba(62,207,142,.16);border-color:rgba(62,207,142,.5)}
.badges{display:flex;flex-wrap:wrap;gap:10px}
.badges>*{flex:1 1 210px;min-width:0}
.badge{display:flex;gap:12px;align-items:center;background:var(--surface2);border-radius:12px;padding:12px}
.be{font-size:26px;line-height:1;flex:none;width:34px;text-align:center}
.bt{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.bw{font-weight:700;margin:2px 0}
.recap{background:linear-gradient(160deg,#2a1a52,#16102a);border:1px solid #4a3b7d;border-radius:18px;padding:22px;margin-bottom:12px}
.rk{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);font-weight:700}
.rt{font:800 30px/1.1 "Bricolage Grotesque",sans-serif;margin-top:6px}
.rl{color:var(--muted);font-size:13px;margin-bottom:16px}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.rstats div{background:rgba(255,255,255,.06);border-radius:12px;padding:10px;text-align:center}
.rstats b{display:block;font:800 22px "Bricolage Grotesque",sans-serif}
.rstats span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.rb{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;padding:9px 0;border-top:1px solid rgba(255,255,255,.08);align-items:start}
.re{font-size:20px;line-height:1.2}
.rbt{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.rbt span{text-transform:none;letter-spacing:0;font-weight:500}
.rbw{font-weight:700;font-size:15px;line-height:1.35;margin-top:2px}
.recapm .actions{position:sticky;bottom:-18px;background:var(--surface);margin:12px -18px -18px;padding:12px 18px;border-top:1px solid var(--line)}
.recaptext{white-space:pre-wrap;font-size:13px;line-height:1.5;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text)}
.bbody{min-width:0}
.tie{font-size:11px;color:var(--gold);text-transform:none;letter-spacing:0;font-weight:600;margin-left:4px}
.link.more{color:var(--violet-2);font-weight:600;font-size:13px;text-decoration:none;white-space:nowrap}
.link.more:hover{text-decoration:underline}
.rf{margin-top:12px;font-size:11.5px;color:var(--muted);text-align:center;letter-spacing:.04em}
.lugrid{display:flex;flex-direction:column}
.lurow{display:grid;grid-template-columns:170px minmax(0,1fr) 92px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.lurow:first-child{border-top:0}
.lul{font-size:13px;font-weight:600;color:var(--muted)}
.lurow select{width:100%}
.luf{text-align:right}
.bat{display:flex;flex-direction:column}
.batrow{display:grid;grid-template-columns:28px minmax(0,1fr) 110px 76px;gap:10px;align-items:center;min-height:44px;border-top:1px solid var(--line)}
.batrow:first-child{border-top:0}
.batn{font:800 16px "Bricolage Grotesque",sans-serif;color:var(--violet-2);text-align:center}
.batrow .cardact{justify-content:flex-end;gap:4px}
.emgrid{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}
.emrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px;align-items:center;font-size:14px}
.inp.bad{border-color:var(--red)}
.anns{display:flex;flex-direction:column;margin-top:12px}
.ann{display:grid;grid-template-columns:56px 1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
.ann:first-child{border-top:0}
#annForm input{flex:1}
.bracket{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:center}
.bcol{display:flex;flex-direction:column;gap:14px}
.bmatch{background:var(--surface2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.blabel{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.bteam{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;text-align:left;font-weight:600;min-height:40px}
.bteam[disabled]{cursor:default;color:var(--text)}
.bteam.us{color:var(--gold)}
.bteam.win{border-color:var(--green);background:rgba(62,207,142,.12)}
.bteam.lose{opacity:.45}
.bteam.tbd{color:var(--muted);font-style:italic}
.seed{font-size:11px;color:var(--muted);width:14px}
.champ{margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(245,179,53,.13);color:var(--gold);font-weight:700}
.fajoin{margin-top:12px}
.fajoin summary{cursor:pointer;color:var(--violet-2);font-weight:600;font-size:14px}
.fld2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){
  .ptable.cert{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) 52px 60px 52px}
  .ptable.fa{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) 52px 56px}
  .ptable.fa .nightc{display:none}
  .lurow{grid-template-columns:110px minmax(0,1fr) 70px}
  .chirp{grid-template-columns:1fr auto;gap:2px 10px}
  .chirp .who{grid-column:1}
  .chirp .txt{grid-column:1/-1;grid-row:2}
  .chirp .when{display:none}
  table.spirit th:nth-child(3),table.spirit td:nth-child(3){display:none}
  .sbar{width:22%}
  .fld2{grid-template-columns:1fr}
}
/* ---- round 6 components ---- */
.toast.hasbtn{pointer-events:auto;display:flex;align-items:center;gap:14px}
.toast .undo{background:#1a1330;color:#f3effb;border:0;border-radius:8px;padding:6px 12px;font-weight:700}
.botnav{display:none}
.divpills{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 14px}
.divpills button{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.divpills button.on{background:var(--violet);border-color:var(--violet);color:#fff}
.kit{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13.5px;color:var(--muted)}
.kit b{color:var(--text)}
.sw{width:16px;height:16px;border-radius:5px;border:1px solid #4a3b7d;flex:none}
.sw.dark{background:#0d0918}.sw.light{background:#f3effb}
.gtag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;margin-bottom:4px;white-space:nowrap}
.gtag.bad{background:rgba(255,107,122,.14);color:var(--red)}
.gtag.warn{background:rgba(245,211,58,.13);color:var(--yellow)}
.banner{display:flex;gap:10px;align-items:baseline;padding:12px 14px;border-radius:12px;margin-bottom:14px;font-size:14px}
.banner.bad{background:rgba(255,107,122,.12);border:1px solid rgba(255,107,122,.35)}
.banner.warn{background:rgba(245,211,58,.1);border:1px solid rgba(245,211,58,.3)}
.card .banner{margin:0 0 12px}
.radios{border:0;padding:0;margin:0 0 12px;display:flex;flex-direction:column;gap:8px}
.radios label{display:flex;gap:8px;align-items:center;font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ride{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ride:first-of-type{border-top:0}
.awaylist{display:flex;flex-direction:column;max-height:50vh;overflow:auto}
.awayrow{display:grid;grid-template-columns:24px minmax(0,1fr) 70px;gap:10px;align-items:center;min-height:44px;border-top:1px solid var(--line);font-size:14px}
.awayrow:first-child{border-top:0}
.jn{font:800 14px "Bricolage Grotesque",sans-serif;color:var(--violet-2)}
.numc{justify-content:flex-start}
.hand{font-size:11px;font-weight:700;color:var(--muted);margin-left:6px;flex:none}
.susp{font-size:10.5px;font-weight:800;color:#fff;background:var(--red);border-radius:5px;padding:1px 6px;margin-left:6px;flex:none}
.stars{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stars button{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px}
.stars button b{font:800 20px "Bricolage Grotesque",sans-serif;color:var(--gold)}
.stars button span{font-size:11.5px;color:var(--muted);text-align:center}
.stars button:hover{border-color:var(--violet)}
table.spirit td:nth-child(3),table.spirit th:nth-child(3){width:60px}
table.spirit td:nth-child(4),table.spirit th:nth-child(4){width:52px}
.sbar{width:28%}
.sb{display:block;height:6px;background:#0d0918;border-radius:6px;overflow:hidden}
.sb i{display:block;height:100%;background:var(--gold)}
.steps{display:flex;gap:6px;margin-bottom:12px;font-size:12px;font-weight:700}
.steps span{padding:4px 10px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.steps .done{color:var(--green)}
.steps .on{background:var(--violet);color:#fff}
.ptable.paste{grid-template-columns:56px minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr) 44px;max-height:50vh;overflow:auto}
.inp.mini{width:100%;padding:6px 8px;font-size:13.5px}
.inp.guess{border-color:rgba(245,211,58,.6)}
.btn.live{border-color:rgba(255,107,122,.5);color:#ffb3bc}
.modal.live{max-height:94vh}
.lvhead{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--red)}
.lvdot{width:9px;height:9px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.lvdot{animation:none}}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:12px 0 4px;text-align:center}
.board>div{display:flex;flex-direction:column;align-items:center;min-width:0}
.board .tn{font-size:13px;color:var(--muted);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board b{font:800 52px/1 "Bricolage Grotesque",sans-serif}
.board .dash{font:800 32px "Bricolage Grotesque",sans-serif;color:var(--muted)}
.lvbtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.lvbtns .btn{min-height:48px}
.lvlog{max-height:200px;overflow:auto;display:flex;flex-direction:column}
.lvev{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.lvev:first-child{border-top:0}
.who button i{font-style:normal;color:var(--violet-2);font-weight:800}
.who button[disabled]{opacity:.35}
@media (max-width:560px){
  nav.tabs{display:none}
  .botnav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--bg);border-top:1px solid var(--line);padding:4px 2px calc(4px + env(safe-area-inset-bottom))}
  .botnav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;min-height:52px;color:var(--muted);font-size:10.5px;font-weight:600}

/* standardized player table: ONE grid so every column lines up */

.prow{display:contents}

.tpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px}

<script>
/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pad = n => String(n).padStart(2,'0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO = iso => { const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); };
const fmtDate = (iso,long) => parseISO(iso).toLocaleDateString('en-CA', long?{weekday:'long',month:'long',day:'numeric'}:{weekday:'short',month:'short',day:'numeric'});
const uid = () => (crypto.randomUUID?crypto.randomUUID():'10000000-1000-4000-8000-100000000000'.replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16)));
let toastT; function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3000)}

/* ---------- sport definitions: everything sport-specific lives here ---------- */
const SPORTS = {
  hockey:{ stats:{ fields:[['g','Goals','G'],['a','Assists','A'],['pim','Penalty mins','PIM']], calc:[['PTS',x=>x.g+x.a]], sort:'PTS', skLabel:'Skaters',
      keeper:{ pos:'G', label:'Goalies', against:'ga', fields:[['sv','Saves','SV'],['ga','Goals against','GA']], sort:'SV%',
        calc:[['W-L',r=>`${r.w}-${r.l}`],['SV%',r=>r.sv+r.ga?(r.sv/(r.sv+r.ga)).toFixed(3).replace(/^0/,''):'–'],['GAA',r=>r.gp?(r.ga/r.gp).toFixed(2):'–'],['SO',r=>r.so]],
        gen:(n,R,opp)=>({sv:14+n(16,1),ga:opp}) },
      gen:(n,R,p)=>p.pos==='G'?{g:0,a:R()<.1?1:0,pim:0}:{g:n(3,2.4),a:n(3,1.9),pim:R()<.15?2:0} },
    label:'Hockey', emoji:'🏒', unit:'Goals', ties:false, ot:true, day:4,
    positions:[['G','Goalie'],['D','Defence'],['F','Forward']],
    formats:[{v:'5v5', l:'5-on-5', field:6, target:11}],
    checks:[{pos:['G'], need:1, label:'Goalie', sev:'red', t:'No goalie!', s:v=>'Nobody in net yet. Ping your sub goalies before it’s too late.'}],
    roster:[['G',1],['D',4],['F',8]], subs:['G','D','F'],
    times:['8:30 PM','9:45 PM','11:00 PM'], venues:['Northside Arena, Rink 1','Northside Arena, Rink 2','Eastgate Ice Centre'],
    opp:['Sin Bin Sinners','Zamboni Drivers','Backcheck Brewers','Top Shelf','Cold Ones','Pylons'],
    note:'2 points for a win, 1 for an overtime or shootout loss, 0 for a regulation loss. Ties are broken by goal differential, then goals for.' },
  rugby:{ stats:{ fields:[['tr','Tries','T'],['con','Conversions','CON'],['pen','Penalty goals','PEN'],['yc','Yellow cards','YC']], calc:[['PTS',x=>x.tr*5+x.con*2+x.pen*3]], sort:'PTS',
      gen:(n,R,p)=>({tr:['CE','WG','FB'].includes(p.pos)?n(2,2.2):n(1,3.2), con:p.pos==='FH'?n(4,1.3):0, pen:p.pos==='FH'?n(3,1.6):0, yc:R()<.05?1:0}) },
    label:'Rugby', emoji:'🏉', unit:'Points', ties:true, tries:true, day:6,
    positions:[['PR','Prop'],['HK','Hooker'],['LK','Lock'],['FL','Flanker'],['N8','Number 8'],['SH','Scrum-half'],['FH','Fly-half'],['CE','Centre'],['WG','Wing'],['FB','Fullback']],
    formats:[{v:'15s', l:'15s', field:15, target:18},{v:'10s', l:'10s', field:10, target:13},{v:'7s', l:'7s', field:7, target:10}],
    checks:[
      {pos:['PR','HK'], cert:'fr', need:3, label:'Front row', sev:'yellow', t:'Uncontested scrums', s:v=>`Only ${v} of 3 trained front-rowers. Without three, scrums go uncontested.`},
      {pos:['LK'], cert:'lk', need:2, label:'Locks', formats:['15s','10s'], sev:'yellow', t:'Short on locks', s:v=>`Only ${v} of 2 trained locks. Someone untrained will be locking the scrum and jumping in lineouts.`}],
    roster:[['PR',3],['HK',2],['LK',3],['FL',3],['N8',1],['SH',1],['FH',1],['CE',3],['WG',3],['FB',1]], subs:['PR','LK','WG'],
    times:['11:00 AM','1:00 PM','3:00 PM'], venues:['Memorial Park, Field 3','Riverside Fields, Pitch A','Memorial Park, Field 1'],
    opp:['Old Boys XV','Muddy Boots','Ruck & Roll','Scrum Dogs','Lineout Legends','Sin Bin RFC'],
    note:'4 points for a win and 2 for a draw. +1 try bonus (TB) for scoring 4+ tries, and +1 losing bonus (LB) for losing by 7 or less.' },
  soccer:{ stats:{ fields:[['g','Goals','G'],['a','Assists','A'],['yc','Yellow cards','YC']], calc:[['G+A',x=>x.g+x.a]], sort:'G', skLabel:'Outfield players',
      keeper:{ pos:'GK', label:'Goalkeepers', against:'ga', fields:[['sv','Saves','SV'],['ga','Goals against','GA']], sort:'CS',
        calc:[['W-D-L',r=>`${r.w}-${r.d}-${r.l}`],['CS',r=>r.so],['GA/G',r=>r.gp?(r.ga/r.gp).toFixed(2):'–']],
        gen:(n,R,opp)=>({sv:1+n(6,1.3),ga:opp}) },
      gen:(n,R,p)=>p.pos==='GK'?{g:0,a:0,yc:R()<.05?1:0}:{g:p.pos==='FW'?n(2,2):p.pos==='MF'?n(1,2.4):n(1,4),a:n(2,2.2),yc:R()<.12?1:0} },
    label:'Soccer', emoji:'⚽', unit:'Goals', ties:true, day:0,
    positions:[['GK','Goalkeeper'],['DF','Defender'],['MF','Midfielder'],['FW','Forward']],
    formats:[{v:'11v11', l:'11-a-side', field:11, target:14},{v:'7v7', l:'7-a-side', field:7, target:10},{v:'5v5', l:'5-a-side', field:5, target:8}],
    checks:[{pos:['GK'], need:1, label:'Keeper', sev:'yellow', t:'No keeper', s:v=>'No goalkeeper confirmed. Someone’s going in net, so pick wisely.'}],
    roster:[['GK',1],['DF',4],['MF',4],['FW',3]], subs:['GK','MF'],
    times:['10:00 AM','12:00 PM','2:00 PM'], venues:['Central Park, Field 2','Westside Turf','Central Park, Field 5'],
    opp:['Real Sociables','Expected Goals','Nutmeg FC','Hat Trick Heroes','Sunday Leaguers','Offside Trap'],
    note:'3 points for a win, 1 for a draw. Ties are broken by goal difference, then goals for.' },
  basketball:{ stats:{ fields:[['pts','Points','PTS'],['reb','Rebounds','REB'],['ast','Assists','AST']], calc:[['PPG',(x,gp)=>gp?(x.pts/gp).toFixed(1):'0.0']], sort:'PTS',
      gen:(n,R,p)=>({pts:n(22,1.4),reb:p.pos==='C'?n(12,1.2):p.pos==='F'?n(8,1.4):n(5,1.6),ast:p.pos==='G'?n(8,1.4):n(4,1.8)}) },
    label:'Basketball', emoji:'🏀', unit:'Points', ties:false, day:2,
    positions:[['G','Guard'],['F','Forward'],['C','Center']],
    formats:[{v:'5v5', l:'5-on-5', field:5, target:8},{v:'3v3', l:'3-on-3', field:3, target:4}],
    checks:[],
    roster:[['G',3],['F',3],['C',2]], subs:['G','F'],
    times:['7:00 PM','8:15 PM','9:30 PM'], venues:['Community Centre Gym','Eastside Rec Centre, Court 1','Eastside Rec Centre, Court 2'],
    opp:['Pump Fakes','Bricklayers','Rim Rockers','Bench Mob','Ball Don’t Lie','Air Balls'],
    note:'Ranked by win percentage, then point differential.' },
  football:{ stats:{ fields:[['td','Touchdowns','TD'],['int','Interceptions','INT'],['flg','Flag pulls','FLG']], calc:[], sort:'TD',
      gen:(n,R,p)=>({td:['WR','RU'].includes(p.pos)?n(2,2):p.pos==='QB'?n(1,2.5):n(1,4),int:p.pos==='DB'?n(1,2.5):R()<.05?1:0,flg:['DB','RU'].includes(p.pos)?n(5,1.4):n(2,2)}) },
    label:'Football', emoji:'🏈', unit:'Points', ties:true, day:3,
    positions:[['QB','Quarterback'],['C','Center'],['WR','Receiver'],['RU','Rusher'],['DB','Defensive back']],
    formats:[{v:'7v7', l:'7-on-7 flag', field:7, target:10},{v:'5v5', l:'5-on-5 flag', field:5, target:7}],
    checks:[{pos:['QB'], need:1, label:'QB', sev:'yellow', t:'No quarterback', s:v=>'No QB confirmed. Someone’s throwing ducks tonight.'}],
    roster:[['QB',1],['C',1],['WR',4],['RU',2],['DB',3]], subs:['QB','WR'],
    times:['6:30 PM','7:45 PM','9:00 PM'], venues:['Lakeside Fields, Field 1','Lakeside Fields, Field 2','Northside Turf'],
    opp:['Hail Marys','Flag on the Play','Blitz Crew','End Zone Dancers','Two-Hand Touch','Pick Sixers'],
    note:'Ranked by win percentage (ties count as half a win), then point differential.' },
  baseball:{ stats:{ fields:[['ab','At bats','AB'],['h','Hits','H'],['r','Runs','R'],['rbi','RBIs','RBI'],['hr','Home runs','HR']], calc:[['AVG',x=>x.ab?(x.h/x.ab).toFixed(3).replace(/^0/,''):'.000']], sort:'H', skLabel:'Hitting',
      keeper:{ pos:'P', label:'Pitching', against:'er', both:true, decision:'ip', prefill:{ip:7}, fields:[['ip','Innings pitched','IP'],['k','Strikeouts','K'],['bb','Walks','BB'],['er','Earned runs','ER']], sort:'ERA',
        calc:[['W-L',r=>`${r.w}-${r.l}`],['ERA',r=>r.ip?(r.er*9/r.ip).toFixed(2):'–'],['K/BB',r=>r.bb?(r.k/r.bb).toFixed(1):r.k?'∞':'–']], asc:['ERA'] },
      gen:(n,R,p)=>{ const ab=3+n(1,1), hr=R()<.08?1:0; let h=Math.min(ab,n(3,1.8)); if(hr&&!h) h=1; return {ab,h,r:n(2,2),rbi:n(3,2.2),hr}; } },
    label:'Baseball', emoji:'⚾', unit:'Runs', ties:false, day:1,
    positions:[['P','Pitcher'],['CA','Catcher'],['IF','Infield'],['OF','Outfield']],
    formats:[{v:'9', l:'9 fielders', field:9, target:11},{v:'10', l:'10 fielders (slo-pitch)', field:10, target:12}],
    checks:[
      {pos:['P'], need:1, label:'Pitcher', sev:'yellow', t:'No pitcher', s:v=>'No pitcher confirmed. Someone’s volunteering for the mound.'},
      {pos:['CA'], need:1, label:'Catcher', sev:'yellow', t:'No catcher', s:v=>'No catcher confirmed. Nobody loves catching, so ask early.'}],
    roster:[['P',2],['CA',1],['IF',5],['OF',4]], subs:['CA','OF'],
    times:['6:00 PM','7:30 PM','9:00 PM'], venues:['Riverside Diamond 1','Riverside Diamond 2','Memorial Park Diamond'],
    opp:['Bad News Brews','Seventh Inning Stretch','Can of Corn','Dugout Dogs','Rally Caps','Bunt Club'],
    note:'Ranked by win percentage. GB = games behind the leader.' },
};
const specSet = sp => new Set(sp.checks.flatMap(c=>c.pos));

/* ---------- demo data generation ---------- */
const FIRST = ['Jordan','Dev','Mike','Chris','Sam','Ryan','Kyle','Nate','Erik','Tom','Aidan','Matt','Pat','Liam','Ben','Steph','Callum','Tevita','Owen','Gus','Josh','Rory','Dan','Will','Jake','Seb','Finn','Leo','Harry','Isaac','Max','Noah','Ethan','Zac','Ollie','Marco','Priya','Alex','Jess','Taylor','Morgan','Riley','Casey','Andre','Mateo','Kenji','Omar','Lucas','Ava','Maya'];
const LAST  = ['Mills','Sandhu','Ross','Lau','Okafor','Tremblay','Fraser','Wong','Larsen','Bishop','Kelly','Ruiz','Dubois','Grant','Carter','Nguyen','Reid','Fifita','Hughes','Morgan','Bell','Byrne','Price','Hart','Moore','Allen','Walsh','Santos','Cole','Patel','Turner','Clarke','Shaw','Evans','King','Bianchi','Gill','Chen','Brooks','Fischer','Novak','Singh','Ortiz','Tanaka','Murphy','Kowalski','Haddad','Silva','Park','Lindqvist'];

function makeRoster(sport, seed){
  const sp=SPORTS[sport], R=rng(seed), used=new Set(), players=[];
  const name=()=>{ let f,l; do{ f=FIRST[Math.floor(R()*FIRST.length)]; l=LAST[Math.floor(R()*LAST.length)]; }while(used.has(f+l)); used.add(f+l); return [f,l]; };
  sp.roster.forEach(([pos,n])=>{ for(let i=0;i<n;i++){ const [first,last]=name(); players.push({id:uid(),first,last,pos,sub:false}); } });
  sp.subs.forEach(pos=>{ const [first,last]=name(); players.push({id:uid(),first,last,pos,sub:true}); });
  return players;
}

function scoreGame(sport, R){
  const r=n=>Math.floor(R()*n);
  switch(sport){
    case 'hockey': { let h=r(6),a=r(6),ot=false; if(h===a){ot=true; R()<.5?h++:a++;} return {hs:h,as:a,ot}; }
    case 'rugby': { const ht=r(6),at=r(6),pts=t=>t*5+r(t+1)*2+r(4)*3; return {ht,at,hs:pts(ht),as:pts(at)}; }
    case 'soccer': return {hs:r(4),as:r(4)};
    case 'basketball': { let h=38+r(36),a=38+r(36); if(h===a) R()<.5?h+=2:a+=2; return {hs:h,as:a}; }
    case 'football': { const p=()=>{const td=r(6);return td*6+r(td+1);}; return {hs:p(),as:p()}; }
    case 'baseball': { let h=r(11),a=r(11); if(h===a) R()<.5?h++:a++; return {hs:h,as:a}; }
  }
}

function makeSeason(teamName, sport, seed){
  const sp=SPORTS[sport], R=rng(seed);
  const names=[teamName, ...sp.opp.filter(n=>n!==teamName).slice(0,5)], n=names.length;
  let arr=[...Array(n).keys()]; const rounds=[];
  for(let r=0;r<n-1;r++){ const pairs=[]; for(let i=0;i<n/2;i++) pairs.push([arr[i],arr[n-1-i]]); rounds.push(pairs); arr=[arr[0],arr[n-1],...arr.slice(1,n-1)]; }
  const all=[...rounds, ...rounds.map(p=>p.map(([a,b])=>[b,a]))];
  // first round falls on the sport's game night, about four weeks ago
  const today=new Date(); today.setHours(0,0,0,0);
  const start=new Date(today); start.setDate(start.getDate()-28); while(start.getDay()!==sp.day) start.setDate(start.getDate()+1);
  const games=[];
  all.forEach((pairs,ri)=>{
    const dt=new Date(start); dt.setDate(dt.getDate()+ri*7);
    pairs.forEach(([a,b],pi)=>{
      const g={id:`g${ri}_${pi}`, round:ri+1, date:isoOf(dt), time:sp.times[pi%3], venue:sp.venues[pi%3], home:names[a], away:names[b], final:false};
      if(dt<today) Object.assign(g, scoreGame(sport,R), {final:true});
      games.push(g);
    });
  });
  return {teams:names, games};
}

function makeTeam({name, sport, format, league, pin, sample=true, seed=Math.floor(Math.random()*1e6)}){
  const sp=SPORTS[sport], season=makeSeason(name, sport, seed);
  const t = { id:'t'+uid(), name, sport, pin: pin||'1234', stats:{}, format:format||sp.formats[0].v,
    league: league || `${sp.label} Rec League`, teams:season.teams, games:season.games,
    players: sample ? makeRoster(sport, seed+1) : [] };
  if(sample) genStats(t, seed+2);
  return t;
}
function genStats(t, seed){
  const R=rng(seed), n=(max,bias)=>Math.floor(Math.pow(R(),bias)*(max+1)), sp=SPORTS[t.sport];
  t.games.filter(g=>g.final&&ours(t,g)).forEach(g=>{
    const line=t.stats[g.id]={};
    t.players.forEach(p=>{ if(R()<(p.sub?.25:.82)) line[p.id]=sp.stats.gen(n,R,p); });
    // make scoring stats add up to the real final score
    const home=g.home===t.name, score=home?g.hs:g.as, tries=home?g.ht:g.at;
    const keeper={hockey:'G',soccer:'GK'}[t.sport]; const ids=Object.keys(line).filter(id=>t.players.find(x=>x.id===id).pos!==keeper);
    const spread=(key,total,step=1)=>{ if(!ids.length) return; const w=ids.map(id=>(line[id][key]||0)+.3), sum=w.reduce((x,y)=>x+y,0); ids.forEach(id=>line[id][key]=0);
      for(let left=total; left>0; left-=step){ let x=R()*sum, i=0; while(x>w[i]&&i<ids.length-1){ x-=w[i]; i++; } line[ids[i]][key]+=Math.min(step,left); } };
    const kp=sp.stats.keeper;
    if(kp&&!kp.both){ const opp=home?g.as:g.hs; t.players.filter(p=>p.pos===kp.pos).forEach(p=>delete line[p.id]);
      const ks=t.players.filter(p=>p.pos===kp.pos), k=(R()<.85&&ks.find(p=>!p.sub))||ks.find(p=>p.sub)||ks[0]; if(k) line[k.id]=kp.gen(n,R,opp); }
    if(kp&&kp.both){ // baseball: starter + maybe a reliever; earned runs never exceed runs allowed

      const st=ps[0], rl=ps[1], stIp=rl&&R()<.6?4+n(2,1):7, er=Math.min(opp, Math.round(opp*(.6+R()*.4)));
      const stEr=Math.round(er*stIp/7);

    }

    if(t.sport==='soccer'){ spread('g',score); spread('a',Math.floor(score*.7)); }

}

function seedAvail(t, avail, seed){

/* ---------- headcount ---------- */
function headcount(t,g){
  const sp=SPORTS[t.sport], f=fmt(t), a=availFor(t,g);
  const sus=suspendedIds(t,g), inP=t.players.filter(p=>a[p.id]==='in'&&!sus.has(p.id)), total=inP.length, mbP=t.players.filter(p=>a[p.id]==='maybe'&&!sus.has(p.id));
  const noReply=t.players.filter(p=>!p.sub&&!a[p.id]);
  const fits=c=>p=>c.cert?!!(p.cert&&p.cert[c.cert]):c.pos.includes(p.pos);
  const checks=sp.checks.filter(c=>!c.formats||c.formats.includes(f.v)).map(c=>({...c, v:inP.filter(fits(c)).length, mv:mbP.filter(fits(c)).length}));
  const fails=checks.filter(c=>c.v<c.need), red=fails.find(c=>c.sev==='red'), yellows=fails.filter(c=>c.sev==='yellow');
  let status;
  if(red) status={c:'red', t:red.t, s:[red.s(red.v)]};
  else if(total<f.field) status={c:'red', t:'Need bodies', s:[`${total} of ${f.field} needed to field a team (${f.l}). ${f.field-total} short.`]};
  else if(yellows.length) status={c:'yellow', t:yellows.map(c=>c.t).join(' · '), s:yellows.map(c=>c.s(c.v))};
  else if(total<f.target) status={c:'yellow', t:'Thin bench', s:[`${total} confirmed. Enough to play, but only ${total-f.field} sub${total-f.field===1?'':'s'}. Aim for ${f.target}.`]};
  else status={c:'green', t:'Game on', s:[`${total} confirmed, ${total-f.field} on the bench${checks.length?', and every key position covered':''}.`]};
  const meters=[{l:'Players', v:total, m:mbP.length, n:f.target, min:f.field, hint:`${f.field} to play`}, ...checks.map(c=>({l:c.label, v:c.v, m:c.mv, n:c.need, min:c.need, hint:`need ${c.need}`}))];
  return {status, noReply, meters};
}

/* ---------- season stats ---------- */
function seasonStats(t){
  const sp=SPORTS[t.sport], kp=sp.stats.keeper, skKeys=sp.stats.fields.map(f=>f[0]), kKeys=kp?kp.fields.map(f=>f[0]):[];
  const isK=p=>kp&&p.pos===kp.pos, row=(p,keys)=>({p, gp:0, w:0, d:0, l:0, so:0, ...Object.fromEntries(keys.map(k=>[k,0]))});
  const sk={}, gk={};
  t.players.forEach(p=>{ if(!isK(p)||kp.both) sk[p.id]=row(p,skKeys); if(isK(p)) gk[p.id]=row(p,kKeys); });
  Object.entries(t.stats||{}).forEach(([gid,line])=>{
    const g=t.games.find(x=>x.id===gid); if(!g) return;
    const us=g.home===t.name?g.hs:g.as, them=g.home===t.name?g.as:g.hs;
    const kEntries=[];
    Object.entries(line).forEach(([key,st])=>{
      const kLine=key.startsWith('k:'), pid=kLine?key.slice(2):key, p=t.players.find(x=>x.id===pid); if(!p) return;
      if(kLine || (kp&&!kp.both&&isK(p))){ const r=gk[pid]; if(!r) return; r.gp++; kKeys.forEach(k=>r[k]+=Number(st[k])||0); if((Number(st[kp.against])||0)===0) r.so++; kEntries.push([r,st]); }
      else { const r=sk[pid]; if(!r) return; r.gp++; skKeys.forEach(k=>r[k]+=Number(st[k])||0); }
    });
    // who gets the W/L: every goalie who played, or (baseball) the pitcher with the most innings
    let credited=kEntries.map(e=>e[0]);
    if(kp&&kp.decision&&kEntries.length){ const top=[...kEntries].sort((a,b)=>(Number(b[1][kp.decision])||0)-(Number(a[1][kp.decision])||0))[0]; credited=[top[0]]; }
    credited.forEach(r=>{ if(us>them) r.w++; else if(us<them) r.l++; else r.d++; });
  });
  return {sk:Object.values(sk), gk:Object.values(gk)};
}

/* ---------- standings ---------- */
function standings(t, d){
  const sp=SPORTS[t.sport], src=d||t;
  const rows=Object.fromEntries(src.teams.map(n=>[n,{team:n,gp:0,w:0,d:0,l:0,otl:0,gf:0,ga:0,tb:0,lb:0,pts:0}]));
  src.games.filter(g=>g.final&&!g.cancelled).forEach(g=>{
    const H=rows[g.home], A=rows[g.away]; if(!H||!A) return;
    H.gp++;A.gp++; H.gf+=g.hs;H.ga+=g.as;A.gf+=g.as;A.ga+=g.hs;
    const tie=g.hs===g.as, [W,L]=g.hs>g.as?[H,A]:[A,H];
    if(tie){H.d++;A.d++;} else {W.w++; if(t.sport==='hockey'&&g.ot) L.otl++; else L.l++;}
    if(t.sport==='hockey'){ if(!tie){W.pts+=2; if(g.ot) L.pts+=1;} }
    else if(t.sport==='rugby'){
      if(tie){H.pts+=2;A.pts+=2} else { W.pts+=4; if(Math.abs(g.hs-g.as)<=7){L.lb++;L.pts++} }
      if(g.ht>=4){H.tb++;H.pts++} if(g.at>=4){A.tb++;A.pts++}
    }
    else if(t.sport==='soccer'){ if(tie){H.pts++;A.pts++} else W.pts+=3; }
  });
  const list=Object.values(rows); list.forEach(r=>{ r.diff=r.gf-r.ga; r.pct=r.gp?(r.w+r.d/2)/r.gp:0; });
  const byPts=['hockey','rugby','soccer'].includes(t.sport);
  list.sort((a,b)=> byPts ? (b.pts-a.pts||b.diff-a.diff||b.gf-a.gf) : (b.pct-a.pct||b.diff-a.diff||b.gf-a.gf));
  const lead=list[0]; list.forEach(r=>r.gb=((lead.w-r.w)+(r.l-lead.l))/2);
  return list;
}
const sgn = n => (n>0?'+':'')+n;
const pct = n => n.toFixed(3).replace(/^0/,'');
const COLS = {
  hockey:[['GP','gp'],['W','w'],['L','l'],['OTL','otl'],['GF','gf'],['GA','ga'],['+/-',r=>sgn(r.diff)],['PTS','pts',1]],

/* ---------- fast DOM update: patch only what changed instead of rebuilding the page ---------- */
function morph(root, html){
  const tpl=document.createElement('template'); tpl.innerHTML=html; patchKids(root, tpl.content);
}
function sameNode(a,b){ return a.nodeType===b.nodeType && (a.nodeType!==1 || (a.tagName===b.tagName && (a.tagName!=='INPUT'||a.type===b.type))); }
function patchKids(a,b){
  let ac=a.firstChild, bc=b.firstChild;
  while(bc){ const next=bc.nextSibling;
    if(!ac){ a.appendChild(bc); }
    else if(sameNode(ac,bc)){ patchNode(ac,bc); ac=ac.nextSibling; }
    else { a.replaceChild(bc,ac); ac=bc.nextSibling; }
    bc=next; }
  while(ac){ const n=ac.nextSibling; a.removeChild(ac); ac=n; }
}
function patchNode(a,b){
  if(a.nodeType!==1){ if(a.nodeValue!==b.nodeValue) a.nodeValue=b.nodeValue; return; }
  for(const at of [...a.attributes]) if(!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  for(const at of b.attributes) if(a.getAttribute(at.name)!==at.value) a.setAttribute(at.name,at.value);
  const tg=a.tagName;
  if(tg==='INPUT'){ if(a.type==='checkbox'||a.type==='radio') a.checked=b.hasAttribute('checked'); else if(a.type!=='file'){ const v=b.getAttribute('value')||''; if(a.value!==v) a.value=v; } return; }
  if(tg==='TEXTAREA'){ if(a.value!==b.textContent) a.value=b.textContent; patchKids(a,b); return; }
  if(tg==='SELECT'){ const opts=[...b.querySelectorAll('option')], i=Math.max(0,opts.findIndex(o=>o.hasAttribute('selected'))); patchKids(a,b); if(a.selectedIndex!==i) a.selectedIndex=i; return; }
  patchKids(a,b);
}

function saveScore(id){
  const t=team(), sp=SPORTS[t.sport], g=findGame(t,id), err=document.getElementById('err');
  const num=s=>{const el=document.getElementById(s);return el&&el.value!==''?Number(el.value):NaN;};
  const hs=num('hs'), as=num('as');
  if(!(hs>=0&&as>=0)) return err.textContent='Enter both scores.';
  if(!sp.ties&&hs===as) return err.textContent= sp.ot?'Hockey games need a winner. Check “OT / shootout” and add the winning goal.':`${sp.label} games can’t end in a tie. Check the score.`;
  const upd={hs,as,final:true};
  if(sp.tries){
    const ht=num('ht'), at=num('at');
    if(!(ht>=0&&at>=0)) return err.textContent='Enter tries for both teams. Bonus points depend on them.';
    if(ht*5>hs||at*5>as) return err.textContent='Tries are worth 5 each, so the points don’t add up.';
    Object.assign(upd,{ht,at});
  }
  if(sp.ot){ const ot=document.getElementById('ot').checked; if(ot&&Math.abs(hs-as)!==1) return err.textContent='OT/shootout games are decided by one goal.'; upd.ot=ot; }
  Object.assign(g,upd); closeModal(); save(); render();
  const won=g.home===t.name?hs>as:as>hs, tie=hs===as;
  toast(won?'W logged. First round’s on the captain 🍻':tie?'Draw saved. Standings updated.':'Result saved. Standings updated.');
}

function saveGameStats(id){
  const t=team(), sp=SPORTS[t.sport], g=t.games.find(x=>x.id===id), line={}, err=document.getElementById('err');

  if(t.sport==='baseball' && vals.some(o=>o.ab!=null&&(o.h>o.ab||o.hr>o.h))) return err.textContent='Hits can’t exceed at bats, and home runs can’t exceed hits.';
  if(t.sport==='rugby' && oursT!=null && sum('tr')>oursT) return err.textContent=`That’s ${sum('tr')} tries, but the team only scored ${oursT}.`;
  if(['hockey','soccer'].includes(t.sport) && sum('g')>ours_) return err.textContent=`That’s ${sum('g')} goals, but the team only scored ${ours_}.`;
  if(t.sport==='basketball' && sum('pts')>ours_) return err.textContent=`That’s ${sum('pts')} points, but the team only scored ${ours_}.`;
  const kp=sp.stats.keeper, them=g.home===t.name?g.as:g.hs;
  if(kp){ const kLines=Object.entries(line).filter(([key])=>key.startsWith('k:')||(!kp.both&&(t.players.find(p=>p.id===key)||{}).pos===kp.pos));
    const ag=kLines.reduce((a,[,o])=>a+(o[kp.against]||0),0);
    if(ag>them) return err.textContent= kp.both?`Pitchers are charged ${ag} earned runs, but the other team only scored ${them}.`:`${kp.label} are charged ${ag} goals against, but the other team only scored ${them}.`; }
  if(!vals.length) return err.textContent='Tick at least one player who played.';
  if(kp&&kp.both&&t.innLimit){ const over=Object.entries(line).filter(([k,o])=>k.startsWith('k:')&&(o.ip||0)>t.innLimit).map(([k])=>pById(t,k.slice(2)));
    const btn=document.querySelector('[data-act=savestats]');
    if(over.length&&btn.dataset.ok!=='1'){ btn.dataset.ok='1'; btn.textContent='Save anyway'; return err.textContent=`${over.map(p=>p.first).join(' and ')} went over the league’s ${t.innLimit}-inning limit. Double-check, then tap Save anyway.`; } }
  (t.stats ||= {})[id]=line; closeModal(); save(); render(); toast('Stats saved');
}

const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function buildSchedule(o){
  const R=rng(o.seed), list=[...o.teams];
  for(let i=list.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); [list[i],list[j]]=[list[j],list[i]]; }   // the draw
  if(list.length%2) list.push(null);                                                                    // bye slot
  const n=list.length; let arr=[...Array(n).keys()]; const rounds=[];
  for(let r=0;r<n-1;r++){ const pairs=[]; for(let i=0;i<n/2;i++){ let a=arr[i], b=arr[n-1-i]; if(i===0&&r%2) [a,b]=[b,a]; pairs.push([a,b]); } rounds.push(pairs); arr=[arr[0],arr[n-1],...arr.slice(1,n-1)]; }
  const all=o.double?[...rounds,...rounds.map(p=>p.map(([a,b])=>[b,a]))]:rounds;
  const gpr=Math.floor(o.teams.length/2), slots=[];
  o.times.forEach(time=>o.venues.forEach(venue=>slots.push({time,venue})));
  if(slots.length<gpr) return {error:`That’s ${gpr} games a night but only ${slots.length} time-and-venue slot${slots.length===1?'':'s'}. Add more times or venues.`};
  const used=slots.slice(0,gpr), late=used[used.length-1].time, skip=new Set(o.skip);
  let d=parseISO(o.start); while(d.getDay()!==o.day) d.setDate(d.getDate()+1);
  const games=[], byes=[], skipped=[];
  all.forEach((pairs,ri)=>{
    while(skip.has(isoOf(d))){ skipped.push(isoOf(d)); d.setDate(d.getDate()+7); }
    const date=isoOf(d), real=pairs.filter(([a,b])=>list[a]&&list[b]), bye=pairs.find(([a,b])=>!list[a]||!list[b]);
    if(bye) byes.push({round:ri+1, team:list[bye[0]]||list[bye[1]]});
    real.forEach(([a,b],pi)=>{ const sl=used[(pi+ri)%gpr]; games.push({id:uid(), round:ri+1, date, time:sl.time, venue:sl.venue, home:list[a], away:list[b], final:false}); });
    d.setDate(d.getDate()+7);
  });
  const fair=o.teams.map(tm=>({team:tm, home:games.filter(g=>g.home===tm).length, away:games.filter(g=>g.away===tm).length, late:games.filter(g=>(g.home===tm||g.away===tm)&&g.time===late).length, byes:byes.filter(b=>b.team===tm).length}));
  return {games, byes, skipped, fair, late, rounds:all.length};
}

/* ---------- free agents ---------- */
function genFreeAgents(t, seed){
  const R=rng(seed||7), sp=SPORTS[t.sport], days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], out=[];
  const spec=[...specSet(sp)], pos=sp.positions.map(p=>p[0]);
  const notes=['Can play any position, just want ice time','Former varsity, rusty but keen','New to town, looking for a team','Happy to sub last-minute','Has own gear, will travel','Played rec for 5 years'];
  const plain=pos.filter(x=>!spec.includes(x)); for(let i=0;i<6;i++){ const p=i<2&&spec.length?spec[i%spec.length]:(plain.length?plain:pos)[Math.floor(R()*(plain.length||pos.length))];
    out.push({id:uid(), first:FIRST[Math.floor(R()*FIRST.length)], last:LAST[Math.floor(R()*LAST.length)], pos:p, nights:days.filter(()=>R()<.45).join(', ')||days[sp.day===0?6:sp.day-1], note:notes[Math.floor(R()*notes.length)], team:null}); }

/* ---------- demo seeding for the new features ---------- */
function seedExtras(t, avail, seed){
  ensure(t); const R=rng(seed), r=n=>Math.floor(R()*n), reg=regulars(t), g=nextGame(t);
  t.players.forEach((p,i)=>{ if(R()<.7) t.claims[p.id]='dev-other-'+i; });
  reg.forEach(p=>{ if(R()<.62) t.dues.paid[p.id]=true; if(R()<.55) t.beer.rounds[p.id]=1+r(4); });
  t.beer.shift=r(reg.length||1);
  t.games.filter(x=>x.final&&ours(t,x)).forEach(x=>{
    const a=avail[x.id]={}; t.players.forEach(p=>{ if(playedIn(t,x.id,p.id)) a[p.id]='in'; else if(!p.sub){ const q=R(); if(q<.5) a[p.id]='out'; else if(q<.65) a[p.id]='maybe'; } });
    const pool=t.players.filter(p=>playedIn(t,x.id,p.id)), fav=pool[r(pool.length)];
    if(pool.length>2){ const v=t.mvp[x.id]={}; pool.forEach(voter=>{ if(R()<.6){ let c=R()<.55?fav:pool[r(pool.length)]; if(c===voter) c=pool.find(q=>q!==voter); v[voter.id]=c.id; } }); }
  });
  if(g&&reg.length>3){ const ch=['Who has the pucks this week? Last week was embarrassing','Running 10 min late, start without me','Their goalie is a brick wall, we need traffic in front','Beer duty person: no light beer please 🙏','Wings after? Same place as last time'];

}

/* ---------- badges + recap ---------- */
function badges(t){
  const sp=SPORTS[t.sport], kp=sp.stats.keeper, ss=seasonStats(t), out=[];
  const logged=t.games.filter(g=>g.final&&ours(t,g)&&(t.stats||{})[g.id]).sort((a,b)=>a.date.localeCompare(b.date));
  const reg=regulars(t), names=ps=>ps;
  const best=(rows,fn,min=0)=>{ let top=-Infinity, who=[]; rows.forEach(r=>{ const v=fn(r); if(v>top){top=v;who=[r.p];} else if(v===top) who.push(r.p); }); return top>min?{v:top,who}:null; };
  const mvpWins={}; logged.forEach(g=>{ const m=mvpOf(t,g.id); if(m&&m.p) mvpWins[m.p.id]=(mvpWins[m.p.id]||0)+1; });
  const mv=Object.entries(mvpWins).sort((a,b)=>b[1]-a[1]); if(mv.length) { const top=mv[0][1]; out.push(['🏆','MVP race', names(mv.filter(x=>x[1]===top).map(x=>pById(t,x[0])).filter(Boolean)), `${top} game MVP${top>1?'s':''}`]); }
  const iron=logged.length>=2?reg.filter(p=>logged.every(g=>playedIn(t,g.id,p.id))):[];
  if(iron.length) out.push(['🦾','Iron Man', names(iron), `Played all ${logged.length} games`]);
  const streak=p=>{ let n=0; for(let i=logged.length-1;i>=0;i--){ if(playedIn(t,logged[i].id,p.id)) n++; else break; } return n; };
  const st=best(reg.map(p=>({p})),r=>streak(r.p),1); if(st&&!iron.length) out.push(['🔥','Hot streak', names(st.who), `${st.v} games in a row`]);
  const A=S.avail[t.id]||{}, ghost=best(reg.map(p=>({p})),r=>logged.filter(g=>A[g.id]&&!A[g.id][r.p.id]).length,1);
  if(ghost) out.push(['👻','Ghost', names(ghost.who), `${ghost.v} games with no reply`]);
  const beer=best(reg.map(p=>({p})),r=>t.beer.rounds[r.p.id]||0,0); if(beer) out.push(['🍻','Beer hero', names(beer.who), `${beer.v} round${beer.v>1?'s':''} bought`]);
  const main=sp.stats.calc.find(c=>c[0]===sp.stats.sort), mainFn=main?r=>Number(main[1](r,r.gp))||0:r=>r[sp.stats.fields.find(f=>f[2]===sp.stats.sort)[0]];
  const sc=best(ss.sk,mainFn,0), scLabel={hockey:'🚨 Top scorer',rugby:'💥 Points machine',soccer:'👟 Golden boot',basketball:'🏀 Bucket getter',football:'🏈 End zone regular',baseball:'🎯 Hit parade'}[t.sport].split(' ');
  if(sc) out.push([scLabel[0], scLabel.slice(1).join(' '), names(sc.who), `${sc.v} ${sp.stats.sort}`]);
  if(t.sport==='hockey'){ const pim=best(ss.sk,r=>r.pim,3); if(pim) out.push(['🚫','Sin bin regular', names(pim.who), `${pim.v} penalty minutes`]); }
  if(kp){ const ks=ss.gk.filter(r=>r.gp>0);
    if(t.sport==='hockey'){ const w=best(ks,r=>r.sv+r.ga?r.sv/(r.sv+r.ga):0,0); if(w) out.push(['🧱','Brick wall', names(w.who), `${w.v.toFixed(3).replace(/^0/,'')} save %`]); }
    if(t.sport==='soccer'){ const w=best(ks,r=>r.so,0); if(w) out.push(['🧤','Clean sheet king', names(w.who), `${w.v} clean sheet${w.v>1?'s':''}`]); }
    if(t.sport==='baseball'){ const w=best(ks.filter(r=>r.ip>=5),r=>-(r.er*9/r.ip),-1e9); if(w) out.push(['🔥','Ace', names(w.who), `${(-w.v).toFixed(2)} ERA`]); } }
  return out;
}

/* ---------- lineup builder ---------- */
let LU=null;
function autoLineup(t,g){
  const a=availFor(t,g), sus=suspendedIds(t,g), pool=sortPlayers(t,t.players.filter(p=>a[p.id]==='in'&&!sus.has(p.id))), used=new Set(), slots=slotsFor(t).map(()=>null);
  slotsFor(t).forEach(([,pref],i)=>{ const p=pool.find(p=>!used.has(p.id)&&pref.includes(p.pos)); if(p){ slots[i]=p.id; used.add(p.id); } });
  slotsFor(t).forEach(([,pref],i)=>{ if(slots[i]||pref.includes('G')||pref.includes('GK')) return; const p=pool.find(p=>!used.has(p.id)&&!['G','GK'].includes(p.pos)); if(p){ slots[i]=p.id; used.add(p.id); } });
  return {slots, order:t.sport==='baseball'?pool.map(p=>p.id):[]};
}
function openLineup(t,g){ LU={gid:g.id, ...(JSON.parse(JSON.stringify(t.lineups[g.id]||autoLineup(t,g))))}; renderLineup(); }
function readLineup(){ document.querySelectorAll('select[data-slot]').forEach(s=>LU.slots[+s.dataset.slot]=s.value||null); }
function renderLineup(){
  const t=team(), g=t.games.find(x=>x.id===LU.gid), a=availFor(t,g), slots=slotsFor(t), cap=isCap();
  const sus=suspendedIds(t,g), opts=sortPlayers(t,t.players.filter(p=>(a[p.id]==='in'||a[p.id]==='maybe')&&!sus.has(p.id)));
  const dup={}; LU.slots.forEach(id=>{ if(id) dup[id]=(dup[id]||0)+1; });
  const benched=t.players.filter(p=>a[p.id]==='in'&&!LU.slots.includes(p.id));
  if(t.sport==='baseball'){ const ins=t.players.filter(p=>a[p.id]==='in').map(p=>p.id); LU.order=[...LU.order.filter(id=>ins.includes(id)), ...ins.filter(id=>!LU.order.includes(id))]; }
  const row=([label,pref],i)=>{ const id=LU.slots[i], p=id&&pById(t,id), off=p&&!pref.includes(p.pos), mb=p&&a[p.id]==='maybe';
    return `<div class="lurow"><span class="lul">${esc(label)}</span>${cap?`<select class="inp" data-slot="${i}" aria-label="${esc(label)}"><option value="">— empty —</option>${opts.map(o=>`<option value="${o.id}" ${o.id===id?'selected':''}>${esc(fullName(o))} · ${esc(o.pos)}${a[o.id]==='maybe'?' (maybe)':''}</option>`).join('')}</select>`:`<span>${p?esc(fullName(p)):'<span class="meta">—</span>'}</span>`}
      <span class="luf">${!p?(pref.some(x=>['G','GK','P','CA','HK','QB'].includes(x))?'<span class="st out">Needed</span>':'<span class="st none">Open</span>'):dup[id]>1?'<span class="st out">Twice</span>':mb?'<span class="st maybe">Maybe</span>':off?'<span class="st maybe">Off position</span>':'<span class="st in">✓</span>'}</span></div>`; };
  modalRoot().innerHTML=`<div class="overlay" data-act="close"><div class="modal" role="dialog" aria-modal="true" style="max-width:560px">
    <h2>🧩 Lineup · ${g.home===t.name?'vs':'@'} ${esc(oppOf(t,g))}</h2>
    <p class="meta" style="margin-top:-6px">${fmt(t).l}. Only players marked In or Maybe can be picked. ${cap?'Auto-fill puts everyone in their usual spot first.':''}</p>
    <div class="lugrid">${slots.map(row).join('')}</div>
    ${t.sport==='baseball'?`<h3 class="mh">Batting order</h3><div class="bat">${LU.order.map((id,i)=>{const p=pById(t,id);return `<div class="batrow"><span class="batn">${i+1}</span><span class="fn">${esc(fullName(p))}</span><span class="meta">${esc(posName(t,p.pos))}</span>${cap?`<span class="cardact"><button class="btn small" data-act="batup" data-v="${i}" aria-label="Move ${esc(p.first)} up" ${i?'':'disabled'}>↑</button><button class="btn small" data-act="batdown" data-v="${i}" aria-label="Move ${esc(p.first)} down" ${i<LU.order.length-1?'':'disabled'}>↓</button></span>`:'<span></span>'}</div>`}).join('')}</div>`:''}
    <p class="note">${benched.length?`On the bench: ${benched.map(p=>esc(shortName(p))).join(', ')}`:'Everyone who’s in has a spot.'}</p>
    <div class="actions" style="justify-content:space-between">${cap?`<span class="cardact"><button class="btn" data-act="luauto">Auto-fill</button><button class="btn" data-act="luclear">Clear</button></span>`:'<span></span>'}
      <span class="cardact"><button class="btn" data-act="close">${cap?'Cancel':'Close'}</button>${cap?'<button class="btn primary" data-act="lusave">Save lineup</button>':''}</span></div></div></div>`;
}

/* ---------- calendar + emails ---------- */
function icsFor(t){
  const z=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const ev=t.games.filter(g=>ours(t,g)).map(g=>{ const s=gameDT(g), e=new Date(s.getTime()+90*60e3);
    return ['BEGIN:VEVENT',`UID:${g.id}@headcount.team`,`DTSTART:${z(s)}`,`DTEND:${z(e)}`,`SUMMARY:${SPORTS[t.sport].emoji} ${t.name} ${g.home===t.name?'vs':'@'} ${oppOf(t,g)}`,`LOCATION:${g.venue.replace(/,/g,'\\,')}`,'END:VEVENT'].join('\r\n'); });
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Headcount//EN',`X-WR-CALNAME:${t.name}`,...ev,'END:VCALENDAR'].join('\r\n');

function bracketState(t){ const name=divSel(t,'div').name; return (t.playoffs.byDiv[name] ||= {}); }
function bracket(t){
  const d=divSel(t,'div'), rows=standings(t,d), n=rows.length>=4?4:2, seeds=rows.slice(0,n).map(r=>r.team), P=bracketState(t), org=isOrg();
  const regDone=d.games.every(g=>g.final||g.cancelled), played=new Set(d.games.filter(g=>g.final).map(g=>g.round)).size, total=new Set(d.games.map(g=>g.round)).size;
  const match=(id,a,b,label)=>{ const w=P[id]; const btn=(x,seed)=>x?`<button class="bteam ${w===x?'win':w?'lose':''} ${x===t.name?'us':''}" ${org?`data-act="bwin" data-m="${id}" data-v="${esc(x)}"`:'disabled'}><span class="seed">${seed??''}</span>${esc(x)}</button>`:`<div class="bteam tbd">TBD</div>`;
    return `<div class="bmatch"><div class="blabel">${label}</div>${btn(a,a?seeds.indexOf(a)+1:'')}${btn(b,b?seeds.indexOf(b)+1:'')}</div>`; };
  const champ=P.final;
  const body=n===4?`<div class="bracket">${'<div class="bcol">'+match('sf1',seeds[0],seeds[3],'Semi 1')+match('sf2',seeds[1],seeds[2],'Semi 2')+'</div>'}<div class="bcol">${match('final',P.sf1,P.sf2,'Final')}</div></div>`
    :`<div class="bracket"><div class="bcol">${match('final',seeds[0],seeds[1],'Final')}</div></div>`;
  return `<div class="card">${cardHd(`🏆 Playoffs · ${esc(d.name)}`, org&&Object.keys(P).length?'<button class="btn small" data-act="breset">Reset bracket</button>':'')}${divPills(t,'div')}
    <p class="meta" style="margin:-4px 0 12px">${regDone?'Regular season is done. Seeds are locked.':`Preview from the current standings (${played} of ${total} rounds played). Seeds can still change.`} Top ${n} make it.${org?' Tap a team to send it through.':''}</p>
    ${body}${champ?`<div class="champ">🏆 ${esc(champ)} are your champions${champ===t.name?'. Drinks are on the captain 🍻':''}</div>`:''}</div>`;
}

function extraAct(act,v,el,t,e){
  const g=nextGame(t);
  switch(act){
    case 'beerskip': t.beer.shift++; toast('Beer duty moved to the next person'); return true;
    case 'round': { if(isCap()||!v){ openRoundPicker(t); return false; } t.beer.rounds[v]=(t.beer.rounds[v]||0)+1; toast('Round logged. Legend 🍻'); return true; }
    case 'roundfor': t.beer.rounds[v]=(t.beer.rounds[v]||0)+1; closeModal(); toast(`Round logged for ${shortName(pById(t,v))} 🍻`); return true;
    case 'rotswap': t.rot.shift++; toast('Starter swapped'); return true;
    case 'chirpdel': snap(); Object.values(t.chirps).forEach(l=>{ const i=l.findIndex(c=>c.id===v); if(i>=0) l.splice(i,1); }); toastUndo('Message deleted'); return true;
    case 'mvp': { const me=S.me[t.id]; (t.mvp[el.dataset.g] ||= {})[me]=v; toast('Vote in 🏆'); return true; }
    case 'mvpundo': delete (t.mvp[v]||{})[S.me[t.id]]; return true;
    case 'claimreq': t.claimReq.push({id:uid(), pid:v, device:devId(t), at:Date.now()}); closeModal(); toast('Request sent to your captain'); return true;
    case 'claimok': { const r=t.claimReq.find(x=>x.id===v); if(r){ t.claims[r.pid]=r.device; t.claimReq=t.claimReq.filter(x=>x.id!==v); toast(`${shortName(pById(t,r.pid))} moved to the new phone`); } return true; }
    case 'claimdeny': t.claimReq=t.claimReq.filter(x=>x.id!==v); toast('Request denied'); return true;
    case 'duespay': t.dues.paid[v]=!t.dues.paid[v]; if(!t.dues.paid[v]) delete t.dues.paid[v]; return true;
    case 'duesnudge': { const u=regulars(t).filter(p=>!t.dues.paid[p.id]); toast(u.length?`Dues reminder queued for ${u.map(p=>p.first).join(', ')} (prototype, nothing sent)`:'Everyone’s paid 🙌'); return false; }
    case 'cert': { const p=pById(t,el.dataset.p); p.cert[v]=!p.cert[v]; return true; }
    case 'recap': openRecap(t); return false;
    case 'badgemore': (UI.badgeOpen ||= {})[v]=!UI.badgeOpen[v]; render(); return false;
    case 'lineup': openLineup(t,g); return false;
    case 'luauto': LU={gid:LU.gid,...autoLineup(t,t.games.find(x=>x.id===LU.gid))}; renderLineup(); return false;
    case 'luclear': LU.slots=LU.slots.map(()=>null); renderLineup(); return false;
    case 'batup': case 'batdown': { readLineup(); const i=+v, j=act==='batup'?i-1:i+1; [LU.order[i],LU.order[j]]=[LU.order[j],LU.order[i]]; renderLineup(); return false; }
    case 'lusave': { readLineup(); const {gid,...rest}=LU; t.lineups[gid]=rest; closeModal(); toast('Lineup saved. Players can see it now'); return true; }
    case 'calendar': openCalendar(t); return false;
    case 'emails': openEmails(t); return false;
    case 'emsave': { let bad=0; document.querySelectorAll('[data-em]').forEach(i=>{ const val=i.value.trim(); if(val&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(val)){ bad++; i.classList.add('bad'); } else { i.classList.remove('bad'); const p=pById(t,i.dataset.em); if(val) p.email=val; else delete p.email; } });
      if(bad){ document.getElementById('err').textContent=`${bad} email${bad>1?'s look':' looks'} wrong. Fix the highlighted one${bad>1?'s':''}.`; return false; } closeModal(); toast('Emails saved'); return true; }
    case 'copytext': { const src=document.getElementById(v), txt=src.value; try{ navigator.clipboard.writeText(txt).then(()=>toast('Copied'),()=>{ src.hidden=false; src.select(); toast('Couldn’t copy automatically. It’s selected, so copy it yourself.'); }); }catch(_){ toast('Couldn’t copy. Select the text and copy it manually.'); } return false; }
    case 'orgpin': openOrgPin(t); return false;
    case 'orgsubmit': { const i=document.getElementById('orgIn'); if(i.value===t.orgPin){ (UI.org ||= {})[t.id]=true; closeModal(); toast('Organizer mode on'); return true; } document.getElementById('err').textContent='Wrong organizer PIN.'; i.value=''; return false; }
    case 'orglock': UI.org[t.id]=false; return true;
    case 'orgscores': S.tab='schedule'; S.showAll=true; return true;
    case 'anndel': snap(); t.ann=t.ann.filter(a=>a.id!==v); toastUndo('Announcement deleted'); return true;
    case 'bwin': { const m=el.dataset.m, P=bracketState(t); P[m]=v; if(m!=='final') delete P.final; return true; }
    case 'breset': snap(); t.playoffs.byDiv[divSel(t,'div').name]={}; toastUndo('Bracket reset'); return true;
    case 'faask': { const x=t.fa.find(f=>f.id===v); toast(`Sub request emailed to ${x.first} for ${g?fmtDate(g.date):'your next game'} (prototype, nothing sent)`); return false; }
  }
  return null;
}

/* ---------- divisions ---------- */
const DIV_NOUNS={hockey:['Pucks','Blades','Pylons','Sticks','Zambonis','Biscuits','Dangles','Snipers'],rugby:['Rucks','Mauls','Props','Locks','Boots','Scrums','Lineouts','Knock-ons'],
  soccer:['Nutmegs','Keepers','Strikers','Shinpads','Crossbars','Volleys','Corners','Headers'],basketball:['Bricks','Hoops','Dunkers','Ballers','Rims','Jumpers','Swishes','Screens'],
  football:['Flags','Blitzers','Spirals','Huddles','Sneaks','Snaps','Audibles','Fumbles'],baseball:['Bats','Gloves','Sluggers','Bunts','Diamonds','Dingers','Bleachers','Grounders']};
const DIV_ADJ=['Thirsty','Rusty','Flying','Lucky','Salty','Wild','Late','Lazy','Golden','Iron','Dirty','Sneaky','Mighty','Sunday','Washed','Hungover'];
function divLabels(t){
  const m=/(Div(?:ision)?\.?\s*)([A-Z]|\d+)\s*$/i.exec(t.league||''), pre=m?m[1]:'Div ', mine=m?m[2].toUpperCase():'C';
  const pool=/\d/.test(mine)?['1','2','3','4']:['A','B','C','D'];
  return {mine:pre+mine, others:pool.filter(x=>x!==mine).slice(0,2).map(x=>pre+x)};
}
function genDivs(t){
  const R=rng(t.name.length*131+7), L=divLabels(t), used=new Set(t.teams), nouns=DIV_NOUNS[t.sport];
  const name=()=>{ let n; do{ n=`${DIV_ADJ[Math.floor(R()*DIV_ADJ.length)]} ${nouns[Math.floor(R()*nouns.length)]}`; }while(used.has(n)); used.add(n); return n; };
  return L.others.map((dn,i)=>{ const names=Array.from({length:6},name); const s=makeSeasonNames(names,t.sport,(t.name.length+i)*977);
    s.games.forEach(g=>g.id='d'+i+'_'+g.id); return {name:dn, teams:names, games:s.games}; });
}
function makeSeasonNames(names, sport, seed){
  const sp=SPORTS[sport], R=rng(seed), n=names.length; let arr=[...Array(n).keys()]; const rounds=[];
  for(let r=0;r<n-1;r++){ const pairs=[]; for(let i=0;i<n/2;i++) pairs.push([arr[i],arr[n-1-i]]); rounds.push(pairs); arr=[arr[0],arr[n-1],...arr.slice(1,n-1)]; }
  const all=[...rounds,...rounds.map(p=>p.map(([a,b])=>[b,a]))];
  const today=new Date(); today.setHours(0,0,0,0); const start=new Date(today); start.setDate(start.getDate()-28); while(start.getDay()!==sp.day) start.setDate(start.getDate()+1);
  const games=[]; all.forEach((pairs,ri)=>{ const dt=new Date(start); dt.setDate(dt.getDate()+ri*7);
    pairs.forEach(([a,b],pi)=>{ const g={id:`g${ri}_${pi}`,round:ri+1,date:isoOf(dt),time:sp.times[pi%3],venue:sp.venues[(pi+1)%3],home:names[a],away:names[b],final:false}; if(dt<today) Object.assign(g,scoreGame(sport,R),{final:true}); games.push(g); }); });
  return {teams:names, games};
}
function allDivs(t){ return [{name:t.divName, teams:t.teams, games:t.games, mine:true}, ...t.divs]; }
function divSel(t,key){ return allDivs(t).find(d=>d.name===UI[key])||allDivs(t)[0]; }
function divPills(t,key){ if(!t.divs.length) return ''; const cur=divSel(t,key).name;
  return `<div class="divpills" role="tablist" aria-label="Division">${allDivs(t).map(d=>`<button role="tab" aria-selected="${d.name===cur}" class="${d.name===cur?'on':''}" data-act="div" data-k="${key}" data-v="${esc(d.name)}">${esc(d.name)}${d.mine?' · us':''}</button>`).join('')}</div>`; }
function findGame(t,id){ return t.games.find(g=>g.id===id)||t.divs.flatMap(d=>d.games).find(g=>g.id===id); }

/* ---------- ensure + seed ---------- */
function ensure2(t){
  t.kit ||= {}; t.rides ||= {}; t.spirit ||= {}; t.spiritRecv ||= {}; t.manSusp ||= {}; t.subOrder ||= []; t.suspRule ||= {};
  if(!t.divName) t.divName=divLabels(t).mine;
  if(!t.divs) t.divs=t.cloud?[]:genDivs(t);
  if(t.playoffs&&(t.playoffs.sf1||t.playoffs.sf2||t.playoffs.final)) t.playoffs={byDiv:{[t.divName]:{...t.playoffs}}};
  t.playoffs.byDiv ||= {};
  const subs=sortPlayers(t,t.players.filter(p=>p.sub&&!p.guest)).map(p=>p.id); t.subOrder=[...t.subOrder.filter(id=>subs.includes(id)), ...subs.filter(id=>!t.subOrder.includes(id))];
  return t;
}
function seedExtras2(t, avail, seed){
  ensure2(t); const R=rng(seed), r=n=>Math.floor(R()*n), nums=new Set();
  t.players.forEach(p=>{ let n; do{ n=p.pos==='G'||p.pos==='GK'?[1,30,31,35][r(4)]:1+r(98); }while(nums.has(n)); nums.add(n); p.num=n;
    if(t.sport==='hockey') p.hand=R()<.62?'L':'R'; if(t.sport==='baseball') p.hand=['R/R','R/R','R/R','L/L','L/R','S/R'][r(6)]; });
  t.games.filter(g=>g.final&&ours(t,g)).forEach(g=>{ t.spiritRecv[g.id]=3+r(3); if(R()<.7) t.spirit[g.id]={score:2+r(4), note:''}; });
  const g=nextGame(t), reg=regulars(t);
  if(g&&reg.length>4){ t.rides[g.id]={offers:[{id:uid(),pid:reg[2].id,seats:3,from:'Downtown',riders:[reg[5].id]}], needs:[reg[7%reg.length].id]}; }
}

/* ---------- suspensions ---------- */
const SUSP_DEFAULT={hockey:{stat:'pim',every:12,label:'penalty minutes'},soccer:{stat:'yc',every:3,label:'yellow cards'},rugby:{stat:'yc',every:2,label:'yellow cards'}};
function suspRule(t){ const d=SUSP_DEFAULT[t.sport]; return d?{...d,...t.suspRule}:null; }
function suspensions(t){
  const out={}, rule=suspRule(t), add=(gid,pid,why)=>(out[gid] ||= []).push({pid,why});
  Object.entries(t.manSusp).forEach(([pid,gid])=>add(gid,pid,'Captain or organizer decision'));
  if(!rule) return out;
  const games=t.games.filter(g=>ours(t,g)&&!g.cancelled).sort((a,b)=>a.date.localeCompare(b.date)), run={};
  games.forEach((g,i)=>{ const line=(t.stats||{})[g.id]; if(!line) return;
    Object.entries(line).forEach(([pid,o])=>{ if(pid.startsWith('k:')) return; const before=run[pid]||0, after=before+(Number(o[rule.stat])||0); run[pid]=after;
      const n=Math.floor(after/rule.every)-Math.floor(before/rule.every);
      for(let k=1;k<=n;k++){ const sg=games[i+k]; if(sg) add(sg.id,pid,`${after} ${rule.label} this season`); } }); });
  return out;
}
function suspendedIds(t,g){ return new Set(((suspensions(t))[g.id]||[]).map(x=>x.pid)); }

const POS_WORDS={hockey:{goalie:'G',goaltender:'G',g:'G',goalkeeper:'G',defence:'D',defense:'D',d:'D',dman:'D',forward:'F',f:'F',wing:'F',winger:'F',centre:'F',center:'F',c:'F',lw:'F',rw:'F'},
  rugby:{prop:'PR',pr:'PR',hooker:'HK',hk:'HK',lock:'LK',lk:'LK',flanker:'FL',fl:'FL',flank:'FL','number 8':'N8','no 8':'N8',no8:'N8',n8:'N8',eightman:'N8','scrum-half':'SH','scrum half':'SH',scrumhalf:'SH',sh:'SH','fly-half':'FH','fly half':'FH',flyhalf:'FH',fh:'FH',centre:'CE',center:'CE',ce:'CE',wing:'WG',winger:'WG',wg:'WG',fullback:'FB',fb:'FB'},
  soccer:{goalkeeper:'GK',keeper:'GK',goalie:'GK',gk:'GK',defender:'DF',def:'DF',cb:'DF',lb:'DF',rb:'DF',df:'DF',back:'DF',midfielder:'MF',mid:'MF',cm:'MF',mf:'MF',forward:'FW',striker:'FW',st:'FW',fw:'FW',winger:'FW'},
  basketball:{guard:'G',pg:'G',sg:'G',g:'G',forward:'F',sf:'F',pf:'F',f:'F',center:'C',centre:'C',c:'C'},
  football:{quarterback:'QB',qb:'QB',center:'C',centre:'C',receiver:'WR',wr:'WR',rusher:'RU',rush:'RU',ru:'RU',db:'DB',safety:'DB',corner:'DB',defensive:'DB'},
  baseball:{pitcher:'P',p:'P',catcher:'CA',c:'CA',ca:'CA','1b':'IF','2b':'IF','3b':'IF',ss:'IF',infield:'IF',if:'IF',lf:'OF',cf:'OF',rf:'OF',outfield:'OF',of:'OF'}};
function parseRoster(t,text){
  const sp=SPORTS[t.sport], dict=POS_WORDS[t.sport], dflt=[...sp.roster].sort((a,b)=>b[1]-a[1])[0][0], out=[];
  text.split(/\r?\n/).forEach(raw=>{
    let line=raw.replace(/^\s*[-*•\d]+[.)]\s+/,'').trim(); if(!line) return;
    let sub=false, num=null, pos=null;
    if(/\b(sub|spare)\b/i.test(line)){ sub=true; line=line.replace(/\b(sub|spare)\b/ig,' '); }
    const nm=/#\s?(\d{1,2})\b/.exec(line)||/\((\d{1,2})\)/.exec(line); if(nm){ num=+nm[1]; line=line.replace(nm[0],' '); }
    const lower=' '+line.toLowerCase().replace(/[(),\-–—:|\/]/g,' ')+' ';
    Object.keys(dict).sort((a,b)=>b.length-a.length).some(w=>{ const re=new RegExp(`\\s${w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\s`,'i'); if(re.test(lower)){ pos=dict[w]; line=(' '+line+' ').replace(new RegExp(`[\\s(,\\-–—:|]${w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}(?=[\\s),]|$)`,'i'),' '); return true; } return false; });
    const parts=line.replace(/[(),\-–—:|]/g,' ').split(/\s+/).filter(Boolean).filter(x=>!/^\d+$/.test(x));
    if(!parts.length) return;
    const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
    out.push({first:cap(parts[0]), last:parts.slice(1).map(cap).join(' ')||'', pos:pos||dflt, sub, num, guessed:!pos});
  });
  return out;
}
let PASTE=null;
function openPaste(t,step){
  PASTE={step, rows:PASTE&&PASTE.step===step?PASTE.rows:null, text:PASTE&&PASTE.step===step?PASTE.text:''};
  renderPaste();
}

  const t=team(), sp=SPORTS[t.sport], rows=PASTE.rows;
  modalRoot().innerHTML=`<div class="overlay" data-act="close"><div class="modal" role="dialog" aria-modal="true" style="max-width:600px">
    ${PASTE.step?`<div class="steps"><span class="done">1 · Team</span><span class="on">2 · Players</span><span>3 · Invite</span></div>`:''}
    <h2>📋 Paste your roster</h2>
    ${!rows?`<p class="meta" style="margin-top:-6px">Copy the names from your group chat or a spreadsheet, one player per line. Add a position, a number (#12) or “sub” if you like. We’ll sort out the rest.</p>
      <textarea class="inp" id="pasteIn" rows="9" style="width:100%" placeholder="${esc(t.sport==='hockey'?'Jordan Mills, forward #19\nDev Sandhu D\nPat Dubois goalie #31\nLiam Grant (sub)':t.sport==='rugby'?'Callum Reid prop #1\nTevita Fifita hooker\nOwen Hughes lock\nFinn Walsh wing (sub)':'Jordan Mills #9\nDev Sandhu\nLiam Grant (sub)')}">${esc(PASTE.text)}</textarea>`

      <div class="ptable paste" role="table"><div class="prow hd" role="row"><span>#</span><span>${H('First name','First')}</span><span>${H('Last name','Last')}</span><span>${H('Position','Pos')}</span><span>Sub</span></div>
